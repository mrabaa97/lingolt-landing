<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get KasKalba</title>
<!-- A forwarding page, not content: keep it out of search results so it
     never competes with the real landing page. -->
<meta name="robots" content="noindex, follow" />
<style>
  :root { --green: #1d9e75; --ink: #1c2320; --muted: #5b6b63; --line: #e3ede8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
    color: var(--ink); background: #fff; line-height: 1.7;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  h1 { font-size: 24px; margin-bottom: 6px; }
  p { color: var(--muted); margin-bottom: 22px; }
  .btns { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
  a.btn {
    display: block; padding: 14px 20px; border-radius: 12px; text-decoration: none;
    background: var(--green); color: #fff; font-weight: 700;
  }
  a.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  small { display: block; margin-top: 18px; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>KasKalba</h1>
    <p>Learn Lithuanian — in Arabic, English, Russian or Turkish.</p>
    <div class="btns">
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.rabaa.ltlearn">Google Play</a>
      <a class="btn ghost" id="ios" href="https://apps.apple.com/app/id6797941375">App Store</a>
    </div>
    <small><a href="/" style="color:inherit">kaskalba.com</a></small>
  </main>

<script>
  // One link to print on anything: it sends each phone to its own store and
  // shows both buttons to everyone else (desktop, or a phone we can't read).
  //
  // IOS_LIVE stayed false until the App Store review was approved — sending
  // an iPhone to a listing that does not exist yet is worse than showing a
  // choice, because the store answers with a blank "not available" page.
  // Approved and released 2026-08-22 (1.3.2), listing verified live in every
  // storefront checked, Lithuania included.
  var IOS_LIVE = true;

  var PLAY = 'https://play.google.com/store/apps/details?id=com.rabaa.ltlearn';
  var APPLE = 'https://apps.apple.com/app/id6797941375';

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  // iPadOS 13+ reports itself as a Mac; the touch-point count is what still
  // separates an iPad from a desktop Mac.
  var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
              (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  if (isAndroid) location.replace(PLAY);
  else if (isIOS && IOS_LIVE) location.replace(APPLE);
  else if (isIOS) document.getElementById('ios').textContent = 'App Store — coming soon';
</script>
</body>
</html>
