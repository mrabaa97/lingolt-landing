r braucht, in die man dann die Vokabeln einsetzen kann. Auch Pronomen, Artikel, Satzbau, Satzanfänge, etc. Das auf jeden Fall noch einrichten, liebes Team! Dann ist Eure App perfekt! 👌🏼🤩🇯🇵 -Haken beim Nachzeichnen der Hieroglyphen: immer, wenn ich die Hieroglyphen nachzeichnen möchte und es richtig ist, hakt die App und lässt mich das nochmal zeichnen. Im Grunde ist das ja nicht schlimm, es kann nur helfen, aber im Multiplayer-Modus ist das doch etwas schwierig, da es dann um Zeit geht und darum, zu gewinnen. -Multiplayer-Modus: Tolle Idee, das mit einzubauen. 👌🏼🤩 Es macht sehr Spaß und motiviert nochmal mehr. Aber ich hatte das jetzt schon mal ein paar Mal, dass man gar nicht die Chance hat, den Streak seiner Gegner zu sehen, weil das Quiz zu schnell beginnt. Ein Wunsch noch: Chats zwischen den Lernenden, um die Sprachentwicklung noch mehr zu fördern. So könnte man sich in der zu lernende Sprache via Chat unterhalten und so das Schreiben und Leseverständnis verbessern. 😉👌🏼🇯🇵 LG Paul 🤗","at":"تطبيق رائع لتعلّم اللغات الأوروبية! 👌🏼🤩🥳","ab":"كونيتشي وا! 🙋🏻‍♂️🇯🇵 أنصح الجميع حقًّا بهذا التطبيق. لم أتعلّم اليابانية 🇯🇵 إلّا منذ سبعة أيّام (سلسلة من 7🔥! 🥳) وقد استقطبني فورًا (وأستعمل النسخة المميّزة أصلًا 😂👌🏼). وبما أنّي أتعلّم الإسبانية 🇪🇸 في المدرسة أيضًا، فأنا أفعل ذلك بالتوازي أحيانًا — لأنّ Drops يتيح ذلك. وما يعجبني جدًّا أيضًا…"},{"n":118,"id":"14369799609","app":"busuu","country":"gb","stars":3,"version":"30.21.0","date":"2026-07-31","title":"Bonne","body":"L’application est excellente mais y a une pub après chaque lesson dans la version gratuite je pense que c’est trop","at":"جيّد","ab":"التطبيق ممتاز لكن هناك إعلان بعد كلّ درس في النسخة المجّانية، وأظنّ أنّ هذا كثير."},{"n":119,"id":"14175085963","app":"babbel","country":"us","stars":3,"version":"22.1.1","date":"2026-06-12","title":"Mic doesn’t work","body":"I’ve tried all the trouble shooting I see online and nothing fixes it. That’s a huge feature that kinda ruins the experience","at":"الميكروفون لا يعمل","ab":"جرّبتُ كلّ حلول المشاكل التي أراها على الإنترنت ولا شيء يصلحه. هذه ميزة كبيرة، وغيابها يفسد التجربة نوعًا ما."},{"n":120,"id":"13499157576","app":"babbel","country":"pl","stars":5,"version":"21.89.0","date":"2025-12-10","title":"👌","body":"Tutto perfecto","at":"👌","ab":"كلّ شيء مثاليّ"},{"n":121,"id":"12585711141","app":"rosetta","country":"no","stars":3,"version":"8.41.2","date":"2025-04-25","title":"e","body":"if i pay for premium, can i be allowed to use the app in portrait orientation? wild that it’s forced landscape orientation, so uncomfortable to hold my phone like that.","at":"هـ","ab":"إن دفعتُ ثمن النسخة المميّزة، أيُسمح لي باستعمال التطبيق بالوضع العموديّ؟ من الجنون أن يكون الوضع الأفقيّ إجباريًّا، فمن غير المريح إطلاقًا أن أمسك هاتفي هكذا."},{"n":122,"id":"10055996218","app":"babbel","country":"gb","stars":4,"version":"21.28.0","date":"2023-06-20","title":"Using Babbel","body":"Babbel is very well structured, with Italian speakers offering expert models of how to pronounce the various phrases and dialogues. My one criticism is that it is not easy to move more quickly through the exercises. A better overview of the whole course and easier and less clunky navigation through it would be a welcome improvement.","at":"استعمال Babbel","ab":"‏Babbel منظّم تنظيمًا جيّدًا جدًّا، وفيه ناطقون إيطاليّون يقدّمون نماذج خبيرة لنطق العبارات والحوارات المختلفة. انتقادي الوحيد أنّه ليس من السهل التقدّم بسرعة أكبر عبر التمارين. ونظرة عامّة أفضل على الدورة كلّها وتنقّل أسهل وأقلّ ثقلًا فيها سيكونان تحسينًا مرحّبًا به."},{"n":123,"id":"13431311302","app":"pimsleur","country":"nl","stars":1,"version":"7.1.1","date":"2025-11-23","title":"Missleading. You only buy it for one year!","body":"Don’t join! Don’t use this App!!!You only buy it for 1 year. After a year you must pay again. How sad i am? Very sad! I was by lesson 13 still 17 to go i thought. Take care. You don’t buy 30 lessons and can do it in your own time to learn. Very bad this. Missleading.","at":"مضلّل. أنت تشتريه لسنة واحدة فقط!","ab":"لا تشتركوا! لا تستعملوا هذا التطبيق!!! أنت تشتريه لسنة واحدة فقط. وبعد سنة عليك الدفع من جديد. كم أنا حزين؟ حزين جدًّا! كنتُ في الدرس الثالث عشر وظننتُ أنّ أمامي سبعة عشر آخر. انتبهوا. أنت لا تشتري ثلاثين درسًا لتؤدّيها في وقتك الخاصّ. هذا سيّئ جدًّا. مضلّل."},{"n":124,"id":"11068164217","app":"babbel","country":"gb","stars":2,"version":"21.45.0","date":"2024-03-21","title":"No portrait mode on IPad","body":"When it is only in landscape mode you can’t see the keyboard and the question at the same time!!?? Come on development do an iPad version as my phone is too small to use it.","at":"لا وضع عموديّ على الآيباد","ab":"حين يكون الوضع الأفقيّ فقط لا تستطيع رؤية لوحة المفاتيح والسؤال في آن واحد!!؟؟ هيّا يا فريق التطوير، اصنعوا نسخة للآيباد، فهاتفي أصغر من أن أستعمله."},{"n":125,"id":"10806891636","app":"memrise","country":"pl","stars":1,"version":"2024.1.8","date":"2024-01-10","title":"App’s Setback","body":"I was a huge fun and a subscriber, sadly i have to leave. More and more features are going away. When i started learning with memerise about 8 months ago i could review my whole course with one button. Then the reviews was only for selected themes in „practice” folder. And now! I can’t even revise current material cus the app is wantig me to do conversations and videos. I liked how it was. - Learing words and inteligent rewiev time. Now it’s terrible app.","at":"تراجع التطبيق","ab":"كنتُ من أشدّ المعجبين ومشتركًا، ومع الأسف عليّ الرحيل. المزيد والمزيد من الميزات تختفي. حين بدأتُ التعلّم مع Memrise قبل نحو ثمانية أشهر كنتُ أستطيع مراجعة دورتي كلّها بزرّ واحد. ثمّ صارت المراجعة لمواضيع مختارة فقط في مجلّد «التدرّب». والآن! لا أستطيع حتّى مراجعة المادّة الحالية لأنّ التطبيق يريدني أن أجري محادثات."},{"n":126,"id":"14389186015","app":"duolingo","country":"fi","stars":3,"version":"7.134.0","date":"2026-08-04","title":"Thanks for adding Finnish","body":"We just started to learn Finnish with my daughter and the language teaching is easy and simpler than other apps. Some of the samples are bit unusual but I am sure that they will improve. However after the latest update the amount of adds is coming is getting very annoying.","at":"شكرًا لإضافة الفنلندية","ab":"بدأنا للتوّ تعلّم الفنلندية مع ابنتي، وتعليم اللغة سهل وأبسط من تطبيقات أخرى. بعض الأمثلة غير مألوفة قليلًا لكنّي واثق أنّهم سيحسّنونها. غير أنّه بعد التحديث الأخير صار كمّ الإعلانات مزعجًا جدًّا."},{"n":127,"id":"12041761962","app":"rosetta","country":"pl","stars":1,"version":"8.37.0","date":"2024-12-08","title":"Infinite loading is displayed while sign in to the app","body":"Steps to reproduce: 1. Open app 2. Input valid credentials Actual result: user can’t login to the app This issue I noticed after payment Has 2 phones, but 1 account and can’t use this app :( Please figure out the problem. Thank you","at":"تحميل لا ينتهي عند تسجيل الدخول","ab":"خطوات إعادة إنتاج المشكلة: 1. افتح التطبيق 2. أدخل بيانات صحيحة. النتيجة الفعلية: المستخدم لا يستطيع الدخول. لاحظتُ هذه المشكلة بعد الدفع. عندي هاتفان وحساب واحد ولا أستطيع استعمال هذا التطبيق :( أرجو أن تكتشفوا المشكلة. شكرًا"},{"n":128,"id":"12364449629","app":"mondly","country":"tr","stars":5,"version":"10.44.0","date":"2025-02-28","title":"Супер 👍","body":"Замечательное приложение.Куча языков для изучения, темы и подтемы, куча заданий и в конце темы есть даже беседа и проверка знаний,где ты также тренируешь свою речь.","at":"ممتاز 👍","ab":"تطبيق رائع. كمّ هائل من اللغات للتعلّم، ومواضيع ومواضيع فرعية، وكمّ من التمارين، وفي نهاية الموضوع توجد حتّى محادثة واختبار معرفة تدرّب فيه كلامك أيضًا."},{"n":129,"id":"11815527086","app":"rosetta","country":"pl","stars":5,"version":"8.36.0","date":"2024-10-09","title":"Aplikacja","body":"Ponad 10 lat korzystam z różnych programów Rosetta, naprawdę podobają mi się","at":"التطبيق","ab":"أستعمل برامج Rosetta المختلفة منذ أكثر من عشر سنوات، وتعجبني حقًّا"},{"n":130,"id":"14309646515","app":"duolingo","country":"se","stars":5,"version":"7.131.0","date":"2026-07-16","title":"Duolingo","body":"Bra","at":"Duolingo","ab":"جيّد"},{"n":131,"id":"10917418915","app":"memrise","country":"pl","stars":1,"version":"2024.2.3","date":"2024-02-08","title":"Memrise is gone","body":"This is not the same app it used to be. With each update more and more functions are gone. When I started using it a year ago it was one of the best apps available. Now it is a shadow of its former self all in the name of IA generated content. Shame","at":"Memrise انتهى","ab":"لم يعد هذا التطبيق كما كان. مع كلّ تحديث تختفي وظائف أكثر فأكثر. حين بدأتُ استعماله قبل سنة كان من أفضل التطبيقات المتاحة. والآن هو ظلّ لما كان، وكلّ ذلك باسم المحتوى المولَّد بالذكاء الاصطناعيّ. عار."},{"n":132,"id":"12024095649","app":"drops","country":"pl","stars":1,"version":"38.55","date":"2024-12-04","title":"Jestem rozczarowany i czuję się oszukany","body":"Ja czuję się oszukany ponieważ zapłaciłem za licencję dożywotną kupując aplikację z polskim intefejsem i polskimi tłumaczeniami. Niestety developer zmienił funkcjonalność aplikacji usuwając polskie tłumaczenia co sprawia że aplikacja jest dla mnie bezużyteczna. Nie za taką funkcjonalność płaciłem i na pewno w takiej wersji bym tej aplikacji nie kupił. Jest to poprostu nieuczciwe ze strony developera. Edit: Ja rozumiem że przepraszacie za niedogodności jednak tak na prawdę nic z tym nie robicie. Brak tłumaczeń to nie jest temat nowy i to nie pierwsza taka uwaga w komentarzu jaki dostajecie. Aplikacja rozjechała się kilkanaście miesięcy temu, ja rozumiem że zawsze coś może się wywalić i cierpliwie czekałem na jakąś aktualizację jednak było ich już wiele i nic nie poprawiło się w tym temacie. Nie rozumiem też dlaczego tak ciężko jest Wam to rozwiązać bo to wydaje się wyjątkowo błachy problem. Może chociaż spróbujcie dodać jakąś opcję edycji takiego tłumaczenia która zapisze się finalnie na urządzeniu użytkownika - sam sobie wtedy zrobię te tłumaczenia. Na dzień dzisiejszy aplikacji nie da się używać a Wasze kolejne aktualizacje nie poprawiają sytuacji. Przyznam że chciałbym uzyskać zwrot pieniędzy ponieważ na dzień dzisiejszy aplikacja zmieniła swoją funkcjonalność i użyteczność i nie jest to produkt za który zapłaciłem.","at":"خائب ومخدوع","ab":"أشعر أنّي خُدعت لأنّي دفعتُ ثمن رخصة مدى الحياة واشتريتُ التطبيق بواجهة بولندية وترجمات بولندية. وللأسف غيّر المطوّر وظيفة التطبيق فأزال الترجمات البولندية، ممّا يجعل التطبيق عديم الفائدة بالنسبة لي. لم أدفع مقابل هذه الوظيفة، وبهذه النسخة ما كنتُ لأشتري هذا التطبيق قطعًا."},{"n":133,"id":"9629888333","app":"rosetta","country":"nl","stars":5,"version":"8.21.1","date":"2023-02-18","title":"Eerste kennismaking.","body":"Ik vind het een leuke cursus. Maar waar ik vooral fouten mee maak, zijn door de kleine foto’s. Soms vind ik het niet duidelijk. Maar ik doe de cursus ook op de telefoon. Verder is het leuk!","at":"أوّل تعارف","ab":"أرى أنّها دورة لطيفة. لكن ما أخطئ فيه أكثر شيء هو الصور الصغيرة؛ أحيانًا لا تكون واضحة عندي. لكنّي أؤدّي الدورة على الهاتف أيضًا. وعدا ذلك ممتعة!"},{"n":134,"id":"11589607203","app":"pimsleur","country":"nl","stars":5,"version":"5.3","date":"2024-08-09","title":"Amazing!","body":"This app in combination with the Language Transfer app is an awesome combination to learn Spanish. Highly recommend","at":"مذهل!","ab":"هذا التطبيق مع تطبيق Language Transfer تركيبة رائعة لتعلّم الإسبانية. أنصح بها بشدّة"},{"n":135,"id":"12908790488","app":"memrise","country":"us","stars":1,"version":"2025.7.16","date":"2025-07-18","title":"Poor language education","body":"Not for me at all because the method and system of teaching Japanese with this app is nonsense. It’s just premade phrases and some words. Memorizing phrases is not an effective or sensual way to learn a language. I’ll go as far as saying it’s not even a possible way to learn a language. I know there’s a paid version that includes grammar, but as for the free version it’s nonsense. All phrases are premade and there is no explanation of what sound refers to what and how the conjugation was decided nor how it can be changed appropriately. I hate having to watch the videos before and after the word, I see where they were going with that but at least make it optional. Some learners don’t need all that extra reinforcement so it’s just a waste of time. Also, since the bulk of the teachings are entire sentences, it’s all annoying that you can’t change the rate of speaking with the video and audio playback. With all the apps I’ve used as well as college classes, the rate of which many phrases have been recorded for the app is ridiculous, like 2.5x normal speed which is insane for a monolingual native English speaker. Especially if someone also has hearing disabilities to boot. I do not recommend.","at":"تعليم لغة رديء","ab":"لا يناسبني إطلاقًا لأنّ طريقة ونظام تعليم اليابانية بهذا التطبيق بلا معنى. مجرّد عبارات جاهزة وبعض الكلمات. حفظ العبارات ليس طريقة فعّالة ولا حسّية لتعلّم لغة. بل سأذهب أبعد وأقول إنّه ليس حتّى طريقة ممكنة لتعلّم لغة. أعرف أنّ هناك نسخة مدفوعة تتضمّن القواعد، لكن بالنسبة للمجّانية…"},{"n":136,"id":"10777677729","app":"rosetta","country":"nl","stars":1,"version":"8.29.0","date":"2024-01-02","title":"Misleading","body":"The claim that “Rosetta Stone has The Audio Companion – which is designed specifically for hands-free learning, and is available through the Rosetta Stone mobile app” is misleading > Audio Companion requires you to watch pictures, so it’s not possible learn when you are doing an activity (walking, driving, etc).","at":"مضلّل","ab":"ادّعاء أنّ «‏Rosetta Stone فيه Audio Companion المصمَّم خصّيصًا للتعلّم دون استعمال اليدين، وهو متاح عبر تطبيق Rosetta Stone للجوّال» ادّعاء مضلّل ← فـAudio Companion يتطلّب منك النظر إلى صور، فلا يمكن التعلّم أثناء ممارسة نشاط (المشي، القيادة، إلخ)."},{"n":137,"id":"12074077301","app":"mondly","country":"se","stars":1,"version":"10.39.0","date":"2024-12-17","title":"Silje","body":"Elendig app. Den får ikke med all lyd så umulig å komme videre. Spar pengene å kjøp ett Kinderegg og les instrukser på polsk der isteden, lærer du mer av og er billigere","at":"سيليه","ab":"تطبيق بائس. لا يلتقط كلّ الصوت فيستحيل التقدّم. وفّر نقودك واشترِ بيضة كيندر واقرأ التعليمات بالبولندية فيها، ستتعلّم منها أكثر وهي أرخص."},{"n":138,"id":"14349746468","app":"duolingo","country":"no","stars":2,"version":"7.132.0","date":"2026-07-26","title":"Jorge","body":"Used to be good but bugs have been accumulating for quite a while now. I don’t understand what the dev team spends time and effort on","at":"خورخي","ab":"كان جيّدًا لكنّ الأعطال تتراكم منذ مدّة ليست قصيرة. لا أفهم على ماذا يصرف فريق التطوير وقته وجهده."},{"n":139,"id":"12101026100","app":"memrise","country":"de","stars":2,"version":"2024.12.11","date":"2024-12-24","title":"Neue Mängel in der aktuellen Version, Memrise hat sich über die Jahre spürbar verschlechtert.","body":"Im Französischkurs lassen sich die Soundeffekte trotz entsprechender Einstellung nicht abschalten. Es stört die ständige Szenariozusammenfassung nach wenigen neu gelernten Wörtern. Dies vor allem deshalb, weil ich erst über mehrere Klicks zum ganz einfachen Weiterlernen zurückkomme.","at":"عيوب جديدة في النسخة الحالية، Memrise ساء بشكل ملموس عبر السنين.","ab":"في دورة الفرنسية لا يمكن إطفاء المؤثّرات الصوتية رغم ضبط الإعداد المناسب. ويزعجني ملخّص السيناريو المستمرّ بعد كلمات جديدة قليلة، وخاصّة لأنّي أحتاج عدّة نقرات للعودة إلى مواصلة التعلّم البسيط."},{"n":140,"id":"13768767684","app":"mondly","country":"de","stars":3,"version":"10.65.0","date":"2026-02-19","title":"Viele Möglichkeiten mit häufig unkorrekter Übersetzung","body":"Das System ist super, weil sowohl das Sprechen als auch schriftliche Aktivitäten möglich sind. Die Übersetzung lässt allerdings in vielen Fällen zu Wünschen übrig. Café wird hier in einem Fall mit Trattoria übersetzt, was aber eher einem rustikalen Restaurant entspricht. Die Umstellung auf das nächste Level funktioniert nicht.","at":"إمكانات كثيرة مع ترجمة غير صحيحة في أحيان كثيرة","ab":"النظام ممتاز لأنّ الكلام والأنشطة الكتابية ممكنان معًا. لكنّ الترجمة تترك الكثير مرجوًّا في حالات كثيرة. فكلمة Café تُترجم هنا في إحدى الحالات إلى Trattoria، وهي أقرب إلى مطعم ريفيّ. والانتقال إلى المستوى التالي لا يعمل."},{"n":141,"id":"11492227803","app":"mondly","country":"nl","stars":3,"version":"10.27.0","date":"2024-07-14","title":"Goeie app maar vertaling niet altijd goed","body":"Ik ben Italiaans aan het leren en heb gemerkt dat de Nederlandse vertaling niet altijd goed is. Vooral bij dingen gebruikt men hem in plaats van het. Dit kost mij punten. Of men vertaald het niet letterlijk terwijl dat wel een goede zin zou zijn in het Nederlands. Dan vertalen ze bijvoorbeeld M.i. piace naar ik vind hem mooi, maar dat staat er niet, want dat zou Penso che sia bellissimo zijn. Dus ik moet heel goed opletten en 2x vertalen, dat wat zij zeggen en dat wat er daadwerkelijk staat. Dat is jammer, maar zie dat vaak terug in vertalingen. Ook zie bijvoorbeeld woorden die men toevoegd, als even, terwijl er geen even in de zin staat. Verder is het wel een goede app en wordt er meer herhaald wat fijn is, want zo onthoud je het beter.","at":"تطبيق جيّد لكنّ الترجمة ليست صحيحة دائمًا","ab":"أتعلّم الإيطالية ولاحظتُ أنّ الترجمة الهولندية ليست صحيحة دائمًا. خصوصًا في الأشياء، يستعملون «hem» بدل «het». وهذا يكلّفني نقاطًا. أو أنّهم لا يترجمون حرفيًّا مع أنّ ذلك كان سيكون جملة سليمة بالهولندية. فيترجمون مثلًا «Mi piace» إلى «أراه جميلًا»، وهذا ليس ما هو مكتوب…"},{"n":142,"id":"13802582710","app":"babbel","country":"de","stars":3,"version":"21.94.0","date":"2026-03-01","title":"Gendern macht das Lernen schwer","body":"Ich finde das System von Babbel eigentlich gut, aber das ständige Gendern ist ein großes Problem für den Lernerfolg. Was „modern“ sein soll, schließt in der Praxis viele Menschen aus. 1. Zu schwer für Menschen mit Lernschwierigkeiten Wer Legasthenie oder ADHS hat, braucht ein klares Schriftbild. Sonderzeichen wie Sterne oder Doppelpunkte in Wörtern stören die Konzentration massiv. Man kann sich nicht mehr auf die eigentliche Vokabel konzentrieren, weil das Wortbild ständig „zerrissen“ wird. Das führt schnell zu Frust und Überforderung. 2. Verwirrung für Ausländer (Deutschlerner) Die deutsche Grammatik mit ihren drei Artikeln ist schon schwer genug. Wenn man nun künstliche Formen lernt, die gar nicht im offiziellen Wörterbuch stehen, ist das sehr verwirrend. In wichtigen Sprachprüfungen oder im Beruf können diese Formen sogar als Fehler gelten. Man lernt hier also etwas, das im echten Alltag oft gar nicht so verlangt wird. 3. Fokus auf das Wesentliche fehlt Eine App sollte das Lernen einfacher machen, nicht komplizierter. Wenn ich mehr Zeit damit verbringe, Gender-Schreibweisen zu entziffern als die Sprache selbst zu üben, geht der Sinn verloren. Hier scheint Ideologie wichtiger zu sein als gute Pädagogik. Fazit: Babbel lässt gerade schwächere Lerner und Nicht-Muttersprachler im Stich. Wer klar und einfach eine Sprache lernen möchte, sollte sich nach Alternativen umsehen.","at":"الصياغة المحايدة جندريًّا تصعّب التعلّم","ab":"أرى نظام Babbel جيّدًا في الأصل، لكنّ الصياغة المحايدة جندريًّا الدائمة مشكلة كبيرة لنجاح التعلّم. ما يُفترض أنّه «حديث» يُقصي عمليًّا كثيرًا من الناس. 1. صعب جدًّا على ذوي صعوبات التعلّم: من عنده عسر قراءة أو فرط حركة يحتاج صورة كتابية واضحة. والرموز الخاصّة كالنجوم أو النقطتين داخل الكلمات…"},{"n":143,"id":"13536432779","app":"busuu","country":"tr","stars":5,"version":"29.27.0","date":"2025-12-20","title":"İhsan GEZER","body":"İzngilizceyi öğreten en iyi program harikasınız. 👍","at":"إحسان غيزر","ab":"أفضل برنامج يعلّم الإنجليزية، أنتم رائعون. 👍"},{"n":144,"id":"13883716220","app":"memrise","country":"nl","stars":4,"version":"2026.3.13","date":"2026-03-24","title":"amazing","body":"amazing language learning app! The only problem i have is that i am not able to add any widgets on my phone.","at":"مذهل","ab":"تطبيق تعلّم لغات مذهل! مشكلتي الوحيدة أنّي لا أستطيع إضافة أيّ أداة على شاشة هاتفي."},{"n":145,"id":"11773520088","app":"mondly","country":"cz","stars":3,"version":"10.33.0","date":"2024-09-28","title":"Глючний додаток","body":"Вивчаю чеську з української. Дуже багато неправильних відповідей мені зараховує, якщо українською інший порядок слів, хоча я знаю, як правильно сказати своєю рідною мовою. Дуже часто проблеми з перекладом заперечних та стверджувальних речень, їх просто плутає цей бот. І такі незручності трапляються часто","at":"تطبيق مليء بالأعطال","ab":"أتعلّم التشيكية انطلاقًا من الأوكرانية. يحسب عليّ إجابات خاطئة كثيرة جدًّا إن كان ترتيب الكلمات بالأوكرانية مختلفًا، مع أنّي أعرف كيف أقولها صحيحة بلغتي الأمّ. وكثيرًا ما تحدث مشاكل في ترجمة الجمل المنفية والمثبتة، فهذا الروبوت يخلط بينها ببساطة. وهذه المضايقات تتكرّر كثيرًا."},{"n":146,"id":"14382528292","app":"duolingo","country":"gb","stars":3,"version":"7.133.0","date":"2026-08-03","title":"I love this app!","body":"I really love this app, but there are a few faults i’ve been running into; i complete my daily challenges and then they don’t save they just reset, when i follow somebody it removes my request as if i’ve never sent it (it does both of these constantly) i’ve tried deleting the app, reinstalling, checked my wifi and nothing seems to work. amazing app though i’ve learnt so much, would love to see some more avatar customisation im a big fan of apps that let you express yourself while learning. maybe you can buy different outfits with gems maybe? (cat themed would be amazing 😭)","at":"أحبّ هذا التطبيق!","ab":"أحبّ هذا التطبيق حقًّا، لكنّي أصادف بضعة أعطال: أُنهي تحدّياتي اليومية فلا تُحفَظ بل تُصفَّر، وحين أتابع شخصًا يُحذف طلبي كأنّي لم أرسله قطّ (وكلاهما يحدث باستمرار). جرّبتُ حذف التطبيق وإعادة تثبيته، وفحصتُ الواي فاي، ولا شيء ينفع. تطبيق مذهل."},{"n":147,"id":"14429787742","app":"busuu","country":"tr","stars":1,"version":"30.24.0","date":"2026-08-15","title":"değerlendirme","body":"Uygulama gayet güzel bir yere kadar deneme süren bitince sürekli reklam izletiyor ve sesini kaydettiğin zaman yanlışlıkla bir durum olsa silemiyorsun öneririm ama bu durumlarda hiçte iyi bir uygulama değil","at":"تقييم","ab":"التطبيق جميل جدًّا إلى حدّ ما؛ فحين تنتهي فترة تجربتك يعرض عليك إعلانات باستمرار، وحين تسجّل صوتك لا تستطيع حذفه إن حدث خطأ ما. أنصح به، لكنّه في هذه الحالات ليس تطبيقًا جيّدًا إطلاقًا."},{"n":148,"id":"14353099852","app":"duolingo","country":"nl","stars":5,"version":"7.132.0","date":"2026-07-26","title":"Ik vind het leuk maar","body":"Ik vind het ook stom dat je 5000 keer per dag gaat zeggen dat we super doulingo moeten nemen","at":"يعجبني لكن","ab":"أرى أنّه من الغباء أيضًا أن تقولوا لنا خمسة آلاف مرّة في اليوم إنّ علينا شراء Super Duolingo."},{"n":149,"id":"13275216448","app":"busuu","country":"pl","stars":1,"version":"29.21.0","date":"2025-10-16","title":"Absolutnie żenujące","body":"Moja recenzja nie dotyczy treści merytorycznych ale sposobu traktowania klienta. Opłaciłam roczny dostęp do programu z zastosowaniem zniżki około 80% oferowanej na stronie internetowej Busuu. Mimo to po anulowaniu subskrypcji w związku z upływem siedmiodniowego okresu próbnego, Busuu konsekwentnie, od ponad dwóch tygodni, usiłuje pobrać z mojego konta kwotę PEŁNEJ, a zatem znacznie wyższej, opłaty za roczny dostęp! Obsługa klienta nie odpowiedziała na mojego maila, do którego załączyłam potwierdzenie uiszczonej opłaty i screeny z prób obciążenia konta. A żeby było jeszcze zabawniej, zostałam dziś pozbawiona dostępu do usługi za którą ZAPŁACIŁAM - tak, ROCZNA OPŁACONA subskrypcja została USUNIĘTA z mojego konta mimo ważności do września 2026 roku. Opcja “restore purchase” nie przynosi rezultatu. Podobno nawet usunięcie konta nie spowoduje że Busuu przestanie pobierać opłatę za subskrypcję zatem polecam dwa razy się zastanowić czy chcecie bawić się w opłacanie niedziałającej usługi. Gdyby to było możliwe, wystawiłabym ocenę -100.","at":"محرج تمامًا","ab":"تقييمي لا يخصّ المحتوى العلميّ بل طريقة معاملة الزبون. دفعتُ ثمن وصول سنويّ بخصم نحو 80% معروض على موقع Busuu. ومع ذلك، وبعد إلغائي الاشتراك عند انتهاء فترة التجربة ذات السبعة أيّام، ما زال Busuu يحاول باستمرار منذ أكثر من أسبوعين أن يسحب من حسابي…"},{"n":150,"id":"11747601560","app":"pimsleur","country":"se","stars":1,"version":"5.10.2","date":"2024-09-21","title":"Landscape mode for iPad","body":"The fact that I can’t use this on my iPad in landscape mode prevents me from purchasing this app. It’s a major productivity blocker for me.","at":"الوضع الأفقيّ للآيباد","ab":"كوني لا أستطيع استعمال هذا على الآيباد بالوضع الأفقيّ يمنعني من شراء التطبيق. إنّه عائق إنتاجية كبير بالنسبة لي."},{"n":151,"id":"13400719465","app":"busuu","country":"dk","stars":2,"version":"29.25.0","date":"2025-11-15","title":"Destroyed by Adds","body":"The adds are to firece, several of the adds you cant get out of, it Blocks the app. The learning when it works is OK. When excercise is the one where you have to chose words to form a sentence, you are not able to switch words when you make an error, so you have to delete all the words and start over.","at":"دمّرته الإعلانات","ab":"الإعلانات شرسة جدًّا، وكثير منها لا تستطيع الخروج منه فيحجب التطبيق. التعلّم حين يعمل مقبول. وحين يكون التمرين من نوع اختيار الكلمات لتكوين جملة، لا تستطيع تبديل الكلمات إن أخطأت، فعليك حذفها كلّها والبدء من جديد."},{"n":152,"id":"14424147739","app":"duolingo","country":"us","stars":1,"version":"7.135.1","date":"2026-08-13","title":"New energy system sucks","body":"With the new energy system, it is pretty much impossible to do more than 2 lessons at a time without watching (additional) ads. I'm probably gonna have to start looking for an alternative","at":"نظام الطاقة الجديد سيّئ","ab":"مع نظام الطاقة الجديد يكاد يكون مستحيلًا أداء أكثر من درسين متتاليين دون مشاهدة إعلانات (إضافية). أظنّني سأضطرّ للبحث عن بديل."},{"n":153,"id":"13221053252","app":"rosetta","country":"us","stars":3,"version":"8.43.0","date":"2025-10-03","title":"I wish it were better","body":"This program is better on a desktop, laptop, or tablet rather than mobile. The photos are small and so is the text. Also, the images are from the 1990s or before. It makes it confusing at times to know which image to pick as many of the technologies shown no longer exist. On the positive side, I like the pronunciation help and the idea of visual learning. I do believe it’s best when mixed with others that will teach grammar or have conversations (jumpspeak). For the price, I wish it was better. And I wish they would update their app interface and photos.","at":"ليته كان أفضل","ab":"هذا البرنامج أفضل على حاسوب مكتبيّ أو محمول أو لوحيّ منه على الجوّال. الصور صغيرة والنصّ كذلك. ثمّ إنّ الصور من التسعينيّات أو قبلها، ممّا يجعل من المربك أحيانًا معرفة أيّ صورة تختار لأنّ كثيرًا من التقنيات المعروضة لم تعد موجودة. وفي المقابل، تعجبني مساعدة النطق وفكرة التعلّم البصريّ…"},{"n":154,"id":"12975102704","app":"drops","country":"gb","stars":1,"version":"38.75","date":"2025-08-04","title":"Not An App To Use To Learn Languages","body":"The app teaches you random phrases like \"I dance flamenco\" instead of teaching you most commonly used words and then using those words to then teach you phrases. Why would anyone want to know that before knowing how to say other basic words The connect the dots excierse is by far the worst. No one learns like that, its a completely nonsense excercise which could be replaced by anything It uses images and words to teach you but you have to know their image that correlates to the word. A guy shrugging could mean \"i dont know\" but now whenever I see that image I have to know the word assoicated with the image even if I already know the word the imagr can throw you off if you want to learn some words or get into spanish download it but dont think its gonna teach you how to speak spanish","at":"ليس تطبيقًا يُستعمل لتعلّم اللغات","ab":"التطبيق يعلّمك عبارات عشوائية مثل «أرقص الفلامنكو» بدل أن يعلّمك أكثر الكلمات استعمالًا ثمّ يستعملها ليعلّمك عبارات. لماذا قد يريد أحد معرفة ذلك قبل أن يعرف كيف يقول كلمات أساسية أخرى؟ وتمرين وصل النقاط هو الأسوأ بلا منازع. لا أحد يتعلّم هكذا، إنّه تمرين بلا معنى تمامًا."},{"n":155,"id":"14127864536","app":"mondly","country":"us","stars":2,"version":"10.67.0","date":"2026-05-31","title":"Better Options Available","body":"I‘m very disappointed in Mondly. I wanted to learn some Czech and based on what I had read this seemed like a better option than the more popular apps. Boy, was I wrong. I am unable to go back and review the words it says I already know…and there seems to be no clear reason for Mondly choosing the words and phrases. As further evidence of its disorganization, it shows I’m learning Spanish, Korean and French?? What?? I feel like I wasted my money on the premium version. My simple advice, stay away and find a better option.","at":"توجد خيارات أفضل","ab":"خائب جدًّا من Mondly. أردتُ تعلّم شيء من التشيكية، وبناءً على ما قرأتُ بدا هذا خيارًا أفضل من التطبيقات الأشهر. يا لخطئي! لا أستطيع العودة ومراجعة الكلمات التي يقول إنّي أعرفها… ولا يبدو أنّ هناك سببًا واضحًا لاختيار Mondly الكلمات والعبارات. وكدليل إضافي على فوضويّته…"},{"n":156,"id":"12270756170","app":"busuu","country":"nl","stars":5,"version":"28.24.0","date":"2025-02-04","title":"I like the app, but I would like to ask for one feature","body":"I would like to have a possibility to find people that I know and use the app. For example, I learn Dutch and I know a person who uses Busuu and learns another language, I want to find this person and add as friend. So strange that I can’t do that.","at":"يعجبني التطبيق، لكنّي أطلب ميزة واحدة","ab":"أودّ أن تتاح لي إمكانية العثور على أشخاص أعرفهم ويستعملون التطبيق. مثلًا، أنا أتعلّم الهولندية وأعرف شخصًا يستعمل Busuu ويتعلّم لغة أخرى، وأريد أن أجده وأضيفه صديقًا. من الغريب جدًّا أنّي لا أستطيع ذلك."},{"n":157,"id":"13718410925","app":"busuu","country":"gb","stars":3,"version":"30.0.0","date":"2026-02-05","title":"Brilliant start but less helpful as it goes on","body":"I used to absolutely rave about this app and how it helps you interact with the study materials, the fact that you can get real feedback from native speakers is brilliant and I like the general set up. What is disappointing? Is that as time goes on the review materials and structure of the lessons gets increasingly repetitive… but not in a way that helps you retain the information. for example it will show you a new phrase or a sentence structure and then get you to repeat it three times back to back before moving onto something completely different and not revisiting that same structure. Intermittent repetition would be so much better! Also, there’s no way to practice and review kanji/writing. even the saved review materials seem to repeat in clusters rather than randomised to give you a true test. as time goes on, it seems more and more like I’m just parenting the material as opposed to having to actually think about it myself. which means that I don’t actually retain any of it and have to review the same lessons time and time again. Are used to love how this was speaking and listening focused but as time goes on, I’m finding that I’m spending more and more time trying to decipher the kanji and text (which there is no fast way to revise) and less time actually figuring out what and how I should say things","at":"بداية رائعة لكنّه يقلّ نفعًا مع الوقت","ab":"كنتُ أُطري هذا التطبيق إطراءً شديدًا وكيف يساعدك على التفاعل مع المادّة، وأنّ إمكانية الحصول على ملاحظات حقيقية من ناطقين أصليّين رائعة، ويعجبني الترتيب العامّ. ما يخيّب الأمل؟ أنّه مع مرور الوقت تصير موادّ المراجعة وبنية الدروس متكرّرة أكثر فأكثر… لكن بطريقة لا…"},{"n":158,"id":"14002170807","app":"babbel","country":"us","stars":5,"version":"21.98.1","date":"2026-04-27","title":"Learning German Quick - Add Translate","body":"I’ve began learning German for my career and travel and it’s been very helpful. However, I think it would be great if Babbel implemented a translation feature where you could quickly speak/type to translate from one language to another.","at":"أتعلّم الألمانية بسرعة — أضيفوا الترجمة","ab":"بدأتُ تعلّم الألمانية لعملي وسفري وكان مفيدًا جدًّا. لكنّي أظنّ أنّه سيكون رائعًا لو أضاف Babbel ميزة ترجمة تستطيع بها أن تتكلّم أو تكتب بسرعة لتترجم من لغة إلى أخرى."},{"n":159,"id":"10499346478","app":"mondly","country":"pl","stars":1,"version":"10.10.0","date":"2023-10-21","title":"Scam! don’t buy sub","body":"There is no way to unsubscribe your plan from app or web. They only told you how to do it via email. Tip: to cancel it you have to use external service: secure dot 2c dot com, login with your mail and then stop auto renew sub.","at":"نصب! لا تشتروا الاشتراك","ab":"لا توجد أيّ طريقة لإلغاء اشتراكك من التطبيق ولا من الموقع. لا يخبرونك كيف تفعل ذلك إلّا عبر البريد. نصيحة: لإلغائه عليك استعمال خدمة خارجية: secure نقطة 2c نقطة com، سجّل الدخول ببريدك ثمّ أوقف التجديد التلقائيّ."},{"n":160,"id":"10238690201","app":"babbel","country":"dk","stars":1,"version":"21.32.0","date":"2023-08-09","title":"Good but too expensive","body":"I like the app have used it for a while and will continue but these price increase are tiring. Just needed to complain.","at":"جيّد لكن غالٍ جدًّا","ab":"يعجبني التطبيق، استعملتُه مدّة وسأستمرّ، لكنّ زيادات الأسعار هذه متعبة. أردتُ فقط أن أشتكي."},{"n":161,"id":"12282308657","app":"mondly","country":"de","stars":4,"version":"10.43.0","date":"2025-02-07","title":"Super App","body":"Es macht Spaß, mit der App zu lernen - sie ist super intuitiv, man lernt sehr effektiv direkt in ganzen Sätzen und kann so ein gutes Sprachgefühl entwickeln. Das einzige, was nervt, ist der Smalltalk des Sprachcomputers: Ich will nicht dauernd gelobt, begrüßt und zugequatscht werden, das kostet Zeit und bringt mich nicht weiter. Besser wäre einfach nur ein faktisches Lernen ohne unnötige Gespräche drumherum.","at":"تطبيق ممتاز","ab":"التعلّم بالتطبيق ممتع — إنّه بديهيّ جدًّا، وتتعلّم بفعالية عالية مباشرة بجمل كاملة فتنمّي حسًّا لغويًّا جيّدًا. الشيء الوحيد المزعج هو ثرثرة الحاسوب الناطق: لا أريد أن أُمدَح وأُحيَّا ويُتحدَّث إليّ باستمرار، فهذا يكلّفني وقتًا ولا يقدّمني خطوة."},{"n":162,"id":"14348281628","app":"busuu","country":"us","stars":2,"version":"30.20.0","date":"2026-07-25","title":"Limited AI","body":"Very limited AI. It doesn't respond to anything it doesn't expect. For example. I responded with an answer with more information and it completely ignored it several times","at":"ذكاء اصطناعيّ محدود","ab":"ذكاء اصطناعيّ محدود جدًّا. لا يستجيب لأيّ شيء لا يتوقّعه. مثلًا: أجبتُ بإجابة تحمل معلومات أكثر فتجاهلها تمامًا عدّة مرّات."},{"n":163,"id":"12957768152","app":"drops","country":"de","stars":3,"version":"38.75","date":"2025-07-31","title":"Praktisch, aber nicht präzise","body":"Die App Drops ist sehr benutzerfreundlich und praktisch zum Lernen, aber die Übersetzungen und Bilder sind oft ungenau oder mehrdeutig, sodass kein echtes Sprachverständnis erworben wird, sondern nur Brocken.","at":"عمليّ لكن غير دقيق","ab":"تطبيق Drops سهل الاستعمال جدًّا وعمليّ للتعلّم، لكنّ الترجمات والصور كثيرًا ما تكون غير دقيقة أو محتملة لأكثر من معنى، فلا يُكتسب فهم لغويّ حقيقيّ بل مجرّد فتات."},{"n":164,"id":"9475994328","app":"mondly","country":"se","stars":5,"version":"9.37.2","date":"2023-01-05","title":"Mycket bättre än många spåkappar","body":"Dem kräver ingen betalning för början av din lärning och dem har många bra verktyg som gör att du lär dig språket","at":"أفضل بكثير من تطبيقات لغات كثيرة","ab":"لا يطلبون أيّ دفع لبداية تعلّمك، وعندهم أدوات جيّدة كثيرة تجعلك تتعلّم اللغة"},{"n":165,"id":"14408578795","app":"drops","country":"us","stars":1,"version":"39.17","date":"2026-08-09","title":"Too Busy","body":"The app is now so busy and full of garbage that it wastes my time and I have difficulty navigating it. I used to really like this app, and I thought it was helpful. I particularly like Scripts. Script seems to have been abandoned. I think my last streak was over two years, and it got busy and I abandoned it. I just tried to use it again, and I couldn’t figure out how to pick a language. That is how non-intuitive this app has become. Very disappointing, because I bought the lifetime subscription.","at":"مزدحم جدًّا","ab":"صار التطبيق الآن مزدحمًا ومليئًا بالنفايات لدرجة أنّه يضيّع وقتي وأجد صعوبة في التنقّل فيه. كنتُ أحبّ هذا التطبيق حقًّا وأراه مفيدًا. وأحبّ خصوصًا قسم Scripts، الذي يبدو أنّه تُرك مهملًا. أظنّ أنّ سلسلتي الأخيرة تجاوزت سنتين، ثمّ ازدحم فتركتُه. حاولتُ للتوّ أن أستعمل…"},{"n":166,"id":"9509634766","app":"rosetta","country":"de","stars":1,"version":"8.21.0","date":"2023-01-15","title":"Sprachfunktion unbrauchbar","body":"Neben all den Darstellungsfehlern (Abbildungen zu klein, so dass Inhalt nicht erkennbar ist, überlagerter und somit unlesbarer Text) ist vor allem die Sprachfunktion im Grunde unbrauchbar: manchmal werden falsch gesprochene Antworten als 100% korrekt erkannt trotz z.B. falschem Artikel, sehr oft werden aber auch korrekte Sätze gar nicht oder falsch erkannt, und das geht extrem an die Nerven. Man sagt bis zu 5 mal den gleichen Satz und beim letzten Mal passt es dann. Und nein, es liegt nicht an mir. Wenn man selbst eine Silbe wie „la“ mehrfach wiederholen soll, bis sie angeblich richtig ist, kann das nur an der Technik/Programmierung liegen. Ich gebe der App schon eine Gedenksekunde bis mir das iPhone anzeigt dass das Mikro in Verwendung ist aber auch das hilft nicht.","at":"وظيفة الكلام عديمة الفائدة","ab":"إلى جانب كلّ أخطاء العرض (صور أصغر من أن يُميَّز محتواها، ونصّ متراكب فغير مقروء)، فإنّ وظيفة الكلام في الأساس عديمة الفائدة: أحيانًا تُقبل إجابات منطوقة خطأً على أنّها صحيحة 100% رغم خطأ أداة التعريف مثلًا، وكثيرًا جدًّا ما تُرفض جمل صحيحة…"},{"n":167,"id":"12970585567","app":"pimsleur","country":"se","stars":1,"version":"6.2","date":"2025-08-03","title":"Scam app","body":"Do not download this app. I downloaded it to just check it out, did not subscribe it I removed it. Checked my bank account and it had started charging from nowhere. Not reliable.","at":"تطبيق نصب","ab":"لا تحمّلوا هذا التطبيق. حمّلتُه لأطّلع عليه فقط، ولم أشترك، ثمّ حذفتُه. راجعتُ حسابي البنكيّ فوجدتُ أنّه بدأ يسحب من العدم. غير موثوق."},{"n":168,"id":"13932035222","app":"babbel","country":"us","stars":5,"version":"21.96.2","date":"2026-04-07","title":"Better than Duolingo","body":"I switched over to Babbel not to long ago go but I would never go back to Duolingo bc in Babbel on top of learning vocab of the language it also shows how it works with vowels and stuff like that","at":"أفضل من Duolingo","ab":"انتقلتُ إلى Babbel منذ وقت ليس ببعيد ولن أعود إلى Duolingo أبدًا، لأنّ Babbel إلى جانب تعليم مفردات اللغة يُظهر أيضًا كيف تعمل مع حروف العلّة وأمور من هذا القبيل."},{"n":169,"id":"9605466579","app":"memrise","country":"gb","stars":3,"version":"2023.2.6","date":"2023-02-10","title":"…","body":"It is extremely useful to quickly learn vocabulary, especially as you can choose certain couses such as GCSE modules. I just wish there was a section to write out my answers to practise spelling more!","at":"…","ab":"مفيد جدًّا لتعلّم المفردات بسرعة، خصوصًا أنّك تستطيع اختيار دورات بعينها مثل وحدات الثانوية. أتمنّى فقط لو كان هناك قسم أكتب فيه إجاباتي لأتدرّب على الإملاء أكثر!"},{"n":170,"id":"10330825660","app":"babbel","country":"no","stars":4,"version":"21.34.0","date":"2023-09-03","title":"Veldig bra","body":"Det starter superenkelt i det små, deler opp til enkeltord og bilder og uttale, som gjør at ord og uttrykk fester seg bedre. Da jeg brukte 15-30min hver dag i 3mnd hadde jeg lært meg kjempe mye av dagligdagse uttrykk og små setninger. Jeg bestemte meg da for å kjøpe lifetime for alle språk da jeg synes det er godt oppbygd og kunne tenke meg å lære andre språk også! Grunnen til at jeg gir 4stjerner og ikke 5, er fordi jeg syntes det ved et punkt i kurset ble plutselig, i min mening, litt vanskelig i forhold til hva kurset har lært meg tidligere. Med det mener jeg at setningene var lenger og litt «tyngre» enn f.eks kurset rett før, så jeg synes det var litt tungt til å være en del av nybegynner kurset. Men jeg har tatt det opp igjen etter jeg kjøpte det og selv om jeg ikke alltid husker ordene selv, så forstår jeg det når jeg hører det og kan kjenne de igjen når jeg ser det skrevet! For kontekst så ønsket jeg først å lære polsk for å kunne snakke med polske mennesker på arbeidsplassen. Det har vært så utrolig hyggelig å kunne snakke litt med dem da ikke alle kan så mye engelsk. Jeg har fått skryt av polske folk jeg ikke kjenner om at jeg uttaler ordene veldig bra, og det gir jo lyst til å fortsette! Anbefaler Babbel til alle som ønsker å lære et nytt språk.","at":"جيّد جدًّا","ab":"يبدأ بسيطًا جدًّا بالقليل، ويقسّم إلى كلمات مفردة وصور ونطق، ممّا يجعل الكلمات والتعابير ترسخ أفضل. حين قضيتُ 15–30 دقيقة يوميًّا ثلاثة أشهر كنتُ قد تعلّمتُ الكثير جدًّا من تعابير الحياة اليومية والجمل الصغيرة. فقرّرتُ حينها شراء اشتراك مدى الحياة لكلّ اللغات لأنّي أراه مبنيًّا جيّدًا و…"},{"n":171,"id":"12930711589","app":"memrise","country":"us","stars":5,"version":"2025.7.22","date":"2025-07-24","title":"A+ for me due to native speakers","body":"I’ve tried various apps that generally have the same structure but this one takes the cake for me due to the bite sized exposures to native speakers saying the words and phrases. I’ve always struggled with listening comprehension and hearing them pronounce things as they’d actually would speak conversationally is a game changer for me.","at":"‏A+ عندي بسبب الناطقين الأصليّين","ab":"جرّبتُ تطبيقات مختلفة بنيتها متشابهة عمومًا، لكنّ هذا يتفوّق عندي بسبب المقاطع الصغيرة لناطقين أصليّين ينطقون الكلمات والعبارات. عانيتُ دائمًا من فهم المسموع، وسماعهم ينطقون الأشياء كما ينطقونها فعلًا في المحادثة نقلة نوعية…"},{"n":172,"id":"14101134027","app":"duolingo","country":"no","stars":1,"version":"7.123.1","date":"2026-05-24","title":"Anonym","body":"Glemte å avslutte super, ble trekt for 1 år, og de nekter å gi refusjon. Bomber deg med varslinger for alt annet en å kunne avslutte abonnement.","at":"مجهول","ab":"نسيتُ إلغاء Super فسُحب منّي مبلغ سنة كاملة، ويرفضون ردّ المال. يقصفونك بالتنبيهات في كلّ شيء إلّا في إمكانية إلغاء الاشتراك."},{"n":173,"id":"14393830076","app":"duolingo","country":"lt","stars":5,"version":"7.134.0","date":"2026-08-05","title":"so good its easy to learn italy spanish and more so fun","body":"it like games but you are learning at the same time 😁✌️✌️","at":"رائع جدًّا، سهل تعلّم الإيطالية والإسبانية وغيرها وممتع جدًّا","ab":"كأنّه ألعاب لكنّك تتعلّم في الوقت نفسه 😁✌️✌️"},{"n":174,"id":"13711335871","app":"drops","country":"de","stars":1,"version":"38.90","date":"2026-02-04","title":"Alphabet-Zwang..","body":"Selbst wenn du das kyrillische Alphabet schon kennst, musst du es 4 Tage hintereinander gezwungen \"lernen\", bevor du weitermachen kannst.","at":"إجبار على الأبجدية..","ab":"حتّى لو كنتَ تعرف الأبجدية السيريلية أصلًا، عليك أن «تتعلّمها» إجباريًّا أربعة أيّام متتالية قبل أن تستطيع المتابعة."},{"n":175,"id":"14401856645","app":"duolingo","country":"gb","stars":2,"version":"7.134.0","date":"2026-08-08","title":"Gone downhill","body":"This used to be such a good app but lately there are lots of mistakes in the translations and often there is not an option to skip speaking which means I can’t do lessons at all sometimes. Also complete sections just disappear such as words or stories. I am learning Spanish as I live in Spain but this teaches Latin American Spanish which can be quite different. Other apps offer the option of learning traditional Spanish but not Duolingo. As a result I not longer pay for Max. It’s a shame as it used to be a great app but not anymore.","at":"تراجع","ab":"كان هذا تطبيقًا جيّدًا جدًّا، لكن مؤخّرًا صارت هناك أخطاء كثيرة في الترجمات، وكثيرًا ما لا يوجد خيار لتخطّي الكلام، ممّا يعني أنّي لا أستطيع أداء الدروس إطلاقًا أحيانًا. كذلك تختفي أقسام كاملة مثل الكلمات أو القصص. أتعلّم الإسبانية لأنّي أعيش في إسبانيا لكنّه يعلّم إسبانية أمريكا اللاتينية…"},{"n":176,"id":"11452227189","app":"memrise","country":"dk","stars":3,"version":"2024.6.26","date":"2024-07-03","title":"Decent app for some phrases","body":"I am trying to learn Danish, and use this app occasionally alongside Duolingo. I like the real life clips of people speaking phrases. I like that it repeats this over time to help you to learn. I hate the video clip lessons - they are clips made by the same girl and I’m sorry to say it, but they are terrible, and teach little to no vocab, so feel like a complete waste of time.","at":"تطبيق مقبول لبعض العبارات","ab":"أحاول تعلّم الدنماركية وأستعمل هذا التطبيق أحيانًا إلى جانب Duolingo. تعجبني المقاطع الواقعية لأشخاص ينطقون العبارات. ويعجبني أنّه يكرّرها عبر الوقت ليساعدك على التعلّم. لكنّي أكره دروس مقاطع الفيديو — كلّها مقاطع من صنع الفتاة نفسها، وآسف على قول ذلك، لكنّها فظيعة ولا تعلّم إلّا القليل…"},{"n":177,"id":"10237381341","app":"busuu","country":"cz","stars":5,"version":"27.23.0","date":"2023-08-09","title":"Very helpful but annoying with paid version","body":"App is very helpful and great fun but their paid version ad annoying.","at":"مفيد جدًّا لكن مزعج مع النسخة المدفوعة","ab":"التطبيق مفيد جدًّا وممتع جدًّا، لكنّ إعلان نسختهم المدفوعة مزعج."},{"n":178,"id":"9831093560","app":"drops","country":"nl","stars":2,"version":"36.61","date":"2023-04-17","title":"Feedback","body":"Почему нет перевода на родной язык, после ответа? Получается, что я запомнила картинку, но в голове нет связи с русским словом 🤷 Поэтому большой шанс быстро забыть это слово 🙈","at":"ملاحظات","ab":"لماذا لا توجد ترجمة إلى اللغة الأمّ بعد الإجابة؟ فالنتيجة أنّي حفظتُ الصورة لكن لا رابط في ذهني بينها وبين الكلمة الروسية 🤷 ولذلك احتمال كبير أن أنسى الكلمة بسرعة 🙈"},{"n":179,"id":"12422548121","app":"pimsleur","country":"dk","stars":4,"version":"5.15","date":"2025-03-15","title":"Good but..","body":"It’s really good when your doing those lessons where you have to listen and repeat i think it’s a good idea to have an option to low it down or sped it up, in my opinion it’s way to fast to understand and say the words correctly","at":"جيّد لكن..","ab":"إنّه جيّد حقًّا في الدروس التي عليك فيها أن تستمع وتكرّر. وأرى أنّ من الجيّد وجود خيار لإبطائه أو تسريعه؛ في رأيي هو سريع أكثر من اللازم لفهم الكلمات ونطقها صحيحة."},{"n":180,"id":"14353839875","app":"duolingo","country":"de","stars":4,"version":"7.132.0","date":"2026-07-27","title":"Schreiben","body":"Wenn man selber etwas schreiben muss wird zu schnell erwartet dass man komplexe Wörter schreiben kann","at":"الكتابة","ab":"حين يكون عليك أن تكتب شيئًا بنفسك، يُتوقَّع منك بسرعة أكثر من اللازم أن تكتب كلمات معقّدة"},{"n":181,"id":"13644591199","app":"mondly","country":"dk","stars":2,"version":"10.65.0","date":"2026-01-17","title":"Mangler basis","body":"Fint at man kan lære en masse forskellige ord, og måden er også fin, men man har ikke valgt at lave noget så banalt som alfabetet på ukrainsk, hvilket er det fundamentale i alt sprog.","at":"تنقصه الأساسيات","ab":"جميل أنّك تستطيع تعلّم كثير من الكلمات المختلفة، والطريقة جميلة أيضًا، لكنّهم لم يختاروا صنع شيء بديهيّ كالأبجدية الأوكرانية، وهي أساس كلّ لغة."},{"n":182,"id":"12962377018","app":"mondly","country":"de","stars":1,"version":"10.55.0","date":"2025-08-01","title":"Suboptimal","body":"Neuster Bug: Ich kann mich nicht mehr mit „Mit Apple anmelden“ anmelden, wenn man also Geld investiert hätte in einen ProAccount wäre die Kohle weg. Finger weg vor der verbuggten App! “Mikrofon übersprungen“ steht nicht zur Auswahl. Es bleibt dabei dass die App zwangsweise Zugriff auf das Mikro will und wenn man die Sprachübung nicht macht man das Level nicht abschließen kann 👎 Sprechübungen können nicht übersprungen werden, ein Weiterkommen in den Übungen ist dann nicht mehr möglich.","at":"دون المستوى","ab":"أحدث عطب: لم أعد أستطيع الدخول بـ«تسجيل الدخول بحساب Apple»، فلو كان أحدهم استثمر مالًا في حساب Pro لضاعت نقوده. ابتعدوا عن هذا التطبيق المليء بالأعطال! خيار «تخطّي الميكروفون» غير متاح. ويبقى أنّ التطبيق يريد الوصول إلى الميكروفون إجباريًّا، وإن أردتَ تمرين النطق…"},{"n":183,"id":"14202431298","app":"babbel","country":"us","stars":2,"version":"22.2.0","date":"2026-06-19","title":"False pricing","body":"The      '<div id="upmsg" style="margin-top:10px"></div></details>' +
   '</div>';
  document.getElementById('start').onclick = () => {
    const v = document.getElementById('who').value.trim();
    if (!v) { document.getElementById('who').focus(); return; }
    who = v; save(); render();
  };
  document.getElementById('up').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const box = document.getElementById('upmsg');
    box.textContent = 'جارٍ الإرسال…';
    try {
      const parsed = JSON.parse(await f.text());
      const n = (parsed.rows || []).filter(r => r.codes).length;
      await send(parsed.coder || 'unknown', parsed, n);
      box.innerHTML = '<span style="color:#0d6b4c;font-weight:700">وصل الملفّ. شكرًا لك.</span>';
    } catch (err) {
      box.innerHTML = '<span style="color:#a12626">تعذّر: ' + esc(String(err.message)) + '</span>';
    }
  };
}

function cycle(id, cat) {
  const c = codes[id] || {};
  if (c.none) delete c.none;
  const v = c[cat];
  if (!v) c[cat] = '+'; else if (v === '+') c[cat] = '-'; else delete c[cat];
  codes[id] = c; save(); render();
}
function setNone(id) {
  codes[id] = (codes[id] && codes[id].none) ? {} : { none: true }; save(); render();
}
const isCoded = c => c && (c.none || Object.keys(c).length > 0);

function render() {
  const r = DATA[i], c = codes[r.id] || {};
  const done = DATA.filter(x => isCoded(codes[x.id])).length;
  document.getElementById('root').innerHTML =
   '<header><h1>ترميز · <span style="font-weight:400;color:#6b6b6b">' + esc(who) + '</span></h1>' +
   '<div class="bar"><i style="width:' + (done/DATA.length*100) + '%"></i></div>' +
   '<div class="count">' + (i+1) + ' / ' + DATA.length + ' · مُرمَّز ' + done + '</div></header>' +
   '<div class="card">' +
     '<div class="meta"><b>' + r.app + '</b><b>' + r.country.toUpperCase() + '</b><b>' + r.date + '</b>' +
       '<span class="stars">' + '★'.repeat(r.stars) + '☆'.repeat(5-r.stars) + '</span></div>' +
     '<p class="atitle">' + esc(r.at || r.title) + '</p>' +
     '<div class="abody">' + esc(r.ab || r.body) + '</div>' +
     '<details class="orig"><summary>النصّ الأصليّ</summary>' +
       '<div class="txt"><b>' + esc(r.title) + '</b>\n\n' + esc(r.body) + '</div></details>' +
   '</div>' +
   '<div class="cats">' + CATS.map(([code, ar2, ex], n) => {
     const v = c[code], cls = v === '+' ? ' pos' : v === '-' ? ' neg' : '';
     return '<button class="cat' + cls + '" data-c="' + code + '">' +
       '<span class="k">' + ((n+1)%10) + '</span>' +
       '<span class="n">' + ar2 + '<small>' + ex + '</small></span>' +
       '<span class="s">' + (v || '') + '</span></button>';
   }).join('') + '</div>' +
   '<button class="none' + (c.none ? ' on' : '') + '" id="none">لا ينطبق شيء — تعليق بلا مضمون</button>' +
   '<footer><button class="go prev" id="prev">◀ السابق</button>' +
   '<button class="go next" id="next">التالي ▶</button>' +
   '<button class="go exp" id="exp">إنهاء وتنزيل</button>' +
   '<div class="hint">رقم الفئة: ضغطة = إيجابيّ · ضغطتان = سلبيّ · ثلاث = إلغاء &nbsp;·&nbsp; <b>0</b> = لا شيء &nbsp;·&nbsp; <b>مسافة</b> = التالي</div></footer>';
  document.querySelectorAll('.cat').forEach(b => b.onclick = () => cycle(r.id, b.dataset.c));
  document.getElementById('none').onclick = () => setNone(r.id);
  document.getElementById('next').onclick = () => go(1);
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('exp').onclick = finish;
}
const go = d => { i = Math.max(0, Math.min(DATA.length-1, i+d)); save(); render(); scrollTo(0,0); };

// One writer for both paths — the button at the end, and a file sent later.
async function send(coder, payload, count) {
  const res = await fetch(SB + '/rest/v1/review_codings', {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
               'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ coder: coder, payload: payload, coded_count: count,
                           user_agent: navigator.userAgent.slice(0, 300) }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 160));
}

function finish() {
  const out = { coder: who, at: new Date().toISOString(),
    rows: DATA.map(r => ({ n: r.n, id: r.id, app: r.app, country: r.country,
                           stars: r.stars, codes: codes[r.id] || null })) };
  const text = JSON.stringify(out, null, 1);
  const done = DATA.filter(x => isCoded(codes[x.id])).length;
  document.getElementById('root').innerHTML =
   '<div class="gate"><h2>انتهيت</h2><p>رمّزتَ <b>' + done + '</b> من ' + DATA.length + '.</p>' +
   '<p>اضغط الزرّ لإرسال النتيجة. لا حاجة لملفّات ولا رسائل.</p>' +
   '<button id="send">إرسال النتيجة</button>' +
   '<div id="msg" style="margin-top:12px"></div>' +
   '<details style="margin-top:16px"><summary style="cursor:pointer;color:#6b6b6b;font-size:13px">' +
     'أو أرسلها يدويًّا</summary>' +
     '<button id="dl" style="background:#eceae6;color:#444;margin-top:10px">تنزيل الملفّ</button>' +
     '<textarea readonly>' + esc(text) + '</textarea>' +
     '<button id="cp" style="background:#eceae6;color:#444">نسخ النصّ</button></details>' +
   '<button id="back" style="background:#eceae6;color:#444;margin-top:14px">العودة للترميز</button></div>';

  const msg = document.getElementById('msg');
  document.getElementById('send').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'جارٍ الإرسال…';
    try {
      await send(who, out, done);
      msg.innerHTML = '<div style="background:#effaf5;border:1px solid #0d9b6c;border-radius:12px;' +
        'padding:14px;color:#0d6b4c;font-weight:700">وصلت. شكرًا لك — انتهى دورك.</div>';
      e.target.style.display = 'none';
    } catch (err) {
      // Never a dead end: the work exists, and the manual route is right there.
      e.target.disabled = false; e.target.textContent = 'إعادة المحاولة';
      msg.innerHTML = '<div style="background:#fdf0f0;border:1px solid #d93a3a;border-radius:12px;' +
        'padding:14px;color:#a12626">تعذّر الإرسال (' + esc(String(err.message)) + ').<br>' +
        'أعد المحاولة، أو افتح «أرسلها يدويًّا» تحت الزرّ — عملك محفوظ ولن يضيع.</div>';
    }
  };
  document.getElementById('dl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = 'coded-' + who.replace(/s+/g,'-') + '.json'; a.click();
  };
  document.getElementById('cp').onclick = e => {
    navigator.clipboard.writeText(text).then(() => e.target.textContent = 'نُسخ ✓');
  };
  document.getElementById('back').onclick = render;
}

document.addEventListener('keydown', e => {
  if (!who || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const r = DATA[i]; if (!r) return;
  if (e.key === ' ' || e.key === 'ArrowLeft') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(-1); }
  else if (e.key === '0') setNone(r.id);
  else if (/^[1-9]$/.test(e.key)) { const c = CATS[Number(e.key)-1]; if (c) cycle(r.id, c[0]); }
});

who ? render() : gate();
</script></body></html>
