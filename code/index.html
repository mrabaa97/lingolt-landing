<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ترميز تعليقات — KasKalba</title>
<style>
 :root{--bg:#faf9f7;--card:#fff;--line:#e5e2dd;--ink:#1a1a1a;--dim:#6b6b6b;
       --pos:#0d9b6c;--neg:#d93a3a;--accent:#5b4bd6}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);
      font:16px/1.65 -apple-system,"Segoe UI",system-ui,sans-serif}
 .wrap{max-width:840px;margin:0 auto;padding:18px 16px 130px}
 header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
 h1{font-size:18px;margin:0;font-weight:800}
 .bar{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
 .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
 .count{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
 .meta{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:12px}
 .meta b{background:#f0eeea;padding:2px 9px;border-radius:99px;font-weight:600;color:#444}
 .stars{color:#e8a417;letter-spacing:2px;font-size:15px}
 .atitle{font-weight:800;font-size:19px;margin:0 0 8px;line-height:1.5}
 .abody{font-size:16px;line-height:1.9}
 .orig{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
 .orig summary{cursor:pointer;color:var(--dim);font-size:13px;font-weight:600;user-select:none}
 .orig .txt{direction:ltr;text-align:left;background:#fbfaf8;border:1px solid var(--line);
            border-radius:10px;padding:12px;margin-top:10px;font-size:14.5px;white-space:pre-wrap}
 .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
 .cat{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;
      border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;text-align:right;font:inherit}
 .cat:hover{border-color:#c9c4bc}
 .cat .k{width:22px;height:22px;flex:none;border-radius:6px;background:#f0eeea;color:#777;
         font-size:12px;font-weight:700;display:grid;place-items:center}
 .cat .n{flex:1;line-height:1.35}
 .cat .n small{display:block;color:var(--dim);font-size:11.5px;font-weight:400;margin-top:2px}
 .cat.pos{border-color:var(--pos);background:#effaf5}
 .cat.neg{border-color:var(--neg);background:#fdf0f0}
 .cat .s{font-weight:800;font-size:18px}
 .cat.pos .s{color:var(--pos)} .cat.neg .s{color:var(--neg)}
 .none{margin-top:10px;width:100%;border:1.5px dashed var(--line);background:#fff;border-radius:12px;
       padding:11px;cursor:pointer;font:inherit;color:var(--dim)}
 .none.on{border-color:var(--accent);color:var(--accent);background:#f4f2ff;font-weight:700}
 footer{position:fixed;inset:auto 0 0 0;background:rgba(250,249,247,.97);
        border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:9px;
        justify-content:center;align-items:center;flex-wrap:wrap}
 button.go{border:0;border-radius:11px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}
 .next{background:var(--accent);color:#fff} .prev{background:#eceae6;color:#444}
 .exp{background:var(--pos);color:#fff}
 .hint{color:var(--dim);font-size:12.5px;width:100%;text-align:center}
 .gate{max-width:560px;margin:8vh auto;background:#fff;border:1px solid var(--line);
       border-radius:18px;padding:28px}
 .gate h2{margin:0 0 10px;font-size:22px}
 .gate p{color:#444;margin:0 0 14px}
 .gate ol{color:#444;padding-inline-start:20px} .gate li{margin-bottom:7px}
 .gate input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;
             font:inherit;margin:10px 0}
 .gate button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:11px;
              padding:13px;font:inherit;font-weight:700;cursor:pointer}
 .rules{background:#fffbeb;border:1px solid #f6d98a;border-radius:12px;padding:14px;margin:14px 0}
 .rules b{display:block;margin-bottom:5px}
 textarea{width:100%;height:130px;font:11.5px/1.5 ui-monospace,Consolas,monospace;direction:ltr;
          border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
</style></head><body>
<div class="wrap" id="root"></div>
<script>
const DATA = [{"n":1,"id":"13783215593","app":"memrise","country":"gb","stars":3,"version":"2026.2.17","date":"2026-02-24","title":"It’s ok","body":"The app has a number of bugs which means it’s better to make progress through the web site and then continue with the app. But the strangest feature is when I move it to intermediate mode it suddenly tests me on “ola”…. There’s more polishing needed.","at":"لا بأس به","ab":"التطبيق فيه عدد من الأعطال، ولذلك من الأفضل التقدّم عبر الموقع ثمّ المتابعة على التطبيق. لكن أغرب ما فيه أنّني حين أنقله إلى المستوى المتوسّط يبدأ فجأة باختباري في كلمة «ola»… يحتاج مزيدًا من الصقل."},{"n":2,"id":"12313097043","app":"drops","country":"pl","stars":3,"version":"38.59","date":"2025-02-15","title":"Не зрозумів оновлення","body":"Була серія більше ніж 365 днів поспіль, потім все зникло, якось не логічно, був стимул більший навчатися. Більше тижня навчаючись по пʼять хвилин не зʼявляються нові слова весь час повторення, теж не зрозуміло. Це таке оновлення? Чи це стимул перейти на платну версію.","at":"لم أفهم التحديث","ab":"كانت لديّ سلسلة أكثر من 365 يومًا متتاليًا، ثمّ اختفى كلّ شيء، وهذا غير منطقيّ — كان حافزًا أكبر للتعلّم. وأكثر من أسبوع وأنا أتعلّم خمس دقائق يوميًّا ولا تظهر كلمات جديدة، تكرار طوال الوقت، وهذا أيضًا غير مفهوم. أهذا تحديث؟ أم حافز للانتقال إلى النسخة المدفوعة؟"},{"n":3,"id":"10826059670","app":"memrise","country":"pl","stars":5,"version":"2024.1.8","date":"2024-01-15","title":"It was great before!","body":"I bought pro because it was great. I loved it. Now I have very mixed feelings and I don’t really like it. I might have to cancel subscription but let’s see.","at":"كان رائعًا من قبل!","ab":"اشتريتُ النسخة الاحترافية لأنّه كان رائعًا. أحببتُه. الآن مشاعري مختلطة جدًّا ولا يعجبني حقًّا. ربّما أضطرّ لإلغاء الاشتراك، لكن لننتظر ونرى."},{"n":4,"id":"12950133798","app":"busuu","country":"cz","stars":5,"version":"29.12.0","date":"2025-07-29","title":"5/5⭐️","body":"Je to super apka a doporučuji ji všem. Jen mi tam chybí psaní písmen japonsky jinak je to super","at":"5/5 ⭐️","ab":"تطبيق ممتاز وأنصح به الجميع. ينقصني فيه فقط كتابة الحروف اليابانية، وما عدا ذلك رائع."},{"n":5,"id":"14346635828","app":"duolingo","country":"fi","stars":3,"version":"7.132.0","date":"2026-07-25","title":"App is fine but buggy","body":"I have used Duolingo on and off for over a decade. Recently, I started doing Spanish and German and Italian. Duolingo is great for learning new words, but it does not teach any grammar. Nowadays, it has video calls with an AI, and I got a really good offer for the yearly subscription. However, my main annoyance is that if you pause the call by locking the screen or switching to another app, Duolingo crashes, and you lose all progress. This should be fixed ASAP.","at":"التطبيق جيّد لكنّه مليء بالأعطال","ab":"استعملتُ Duolingo على فترات متقطّعة أكثر من عشر سنوات. بدأتُ مؤخّرًا بالإسبانية والألمانية والإيطالية. Duolingo ممتاز لتعلّم كلمات جديدة، لكنّه لا يعلّم أيّ قواعد. صار فيه الآن مكالمات فيديو مع ذكاء اصطناعيّ، وحصلتُ على عرض جيّد جدًّا للاشتراك السنويّ. لكنّ إزعاجي الأكبر أنّك إن أوقفتَ المكالمة بقفل الشاشة أو بالانتقال إلى تطبيق آخر، ينهار Duolingo، و…"},{"n":6,"id":"14423507099","app":"duolingo","country":"gb","stars":4,"version":"7.135.1","date":"2026-08-13","title":"SOO GOOD","body":"I love duo because it makes languages so easy and fun! I learned a few Japanese and Koran words and I learning a bit of piano too!!!100./. recommend","at":"رائع جدًّا","ab":"أحبّ Duo لأنّه يجعل اللغات سهلة وممتعة! تعلّمتُ بعض الكلمات اليابانية والكورية، وأتعلّم قليلًا من البيانو أيضًا!!! أنصح به 100%."},{"n":7,"id":"11245040132","app":"babbel","country":"fi","stars":3,"version":"21.49.0","date":"2024-05-08","title":"Good app but has many bugs","body":"While the course structure and learning experience is much better than many other apps, there are some fundamental bugs in the app which hinder with learning like in dialogue completion mode the keyboard would hide the text to complete beneath it and therefore make it hard to see and fill the blanks","at":"تطبيق جيّد لكن فيه أعطال كثيرة","ab":"مع أنّ بنية المنهج وتجربة التعلّم أفضل بكثير من تطبيقات أخرى، فهناك أعطال أساسية تعيق التعلّم — مثلًا في وضع إكمال الحوار تختفي الجملة المطلوب إكمالها خلف لوحة المفاتيح، فيصعب رؤيتها وملء الفراغات."},{"n":8,"id":"12360458293","app":"rosetta","country":"tr","stars":3,"version":"8.40.0","date":"2025-02-27","title":"Ses algılama sorunu","body":"Konuşmaları çoğu zaman algılamıyor ve mikrofonunuzda sorun var diyor. Miktofonumda sorun yok, telefonum yeni ve başka hiç bir uygulamada ses algılama problemi yaşamıyorum.","at":"مشكلة في التقاط الصوت","ab":"لا يلتقط الكلام في أغلب الأحيان ويقول إنّ في الميكروفون مشكلة. لا مشكلة في ميكروفوني، هاتفي جديد ولا أواجه مشكلة التقاط صوت في أيّ تطبيق آخر."},{"n":9,"id":"14123372424","app":"babbel","country":"gb","stars":1,"version":"22.0.0","date":"2026-05-30","title":"Good for language learning","body":"The app is easy to use and the lessons are well-structured. There’s not enough unguided speaking practice, nor rigorous practice of grammar concepts. They need to stop the annoying “rate us” pop-up - I’ve downgraded the app to three stars because it’s exceptionally annoying. I’ve paid - now leave me alone. Down to two stars as they keep interrupting me with rate requests. And now one.","at":"جيّد لتعلّم اللغة","ab":"التطبيق سهل الاستعمال والدروس مبنيّة جيّدًا. لا يوجد تدريب كافٍ على الكلام الحرّ، ولا تدريب صارم على القواعد. وعليهم إيقاف نافذة «قيّمنا» المزعجة — خفّضتُ التقييم إلى ثلاث نجوم لأنّها مزعجة بشكل استثنائيّ. دفعتُ — فاتركوني وشأني. ونزلتُ إلى نجمتين لأنّهم يواصلون مقاطعتي بطلبات التقييم. والآن نجمة واحدة."},{"n":10,"id":"14300732317","app":"babbel","country":"de","stars":5,"version":"22.5.0","date":"2026-07-13","title":"Perfekt","body":"Keine blöden Spielchen, einfach motivierendes Lernen!","at":"ممتاز","ab":"لا ألعاب سخيفة، مجرّد تعلّم محفّز!"},{"n":11,"id":"13459245615","app":"drops","country":"us","stars":2,"version":"38.84","date":"2025-11-30","title":"Not the greatest","body":"This feels, in my opinion, like an average copy of Duolingo. The learning activities are similar. Some images are confusing. For example learning to say 1:30 pm. The picture shows 13:30 but the audio is for 1:30. The other disadvantage is that, unlike Duolingo, it seem like you only learn one language at a time I feel that there’s better language learning apps less expensive or even free.","at":"ليس الأفضل","ab":"يبدو لي، في رأيي، نسخة عادية من Duolingo. أنشطة التعلّم متشابهة. وبعض الصور مربكة؛ مثلًا عند تعلّم قول 1:30 ظهرًا تُظهر الصورة 13:30 بينما الصوت يقول 1:30. والعيب الآخر أنّه، بخلاف Duolingo، يبدو أنّك تتعلّم لغة واحدة في كلّ مرّة. أرى أنّ هناك تطبيقات تعلّم لغات أفضل وأرخص أو حتّى مجّانية."},{"n":12,"id":"14293682736","app":"babbel","country":"de","stars":1,"version":"22.5.0","date":"2026-07-12","title":"Kostenlos?","body":"Angebot soll kostenlos sein, aber vorher muss ich ein Abonnement über 12 Monate abschließen, dann gibt es 7 Tage kostenlos und wenn nicht gekündigt wird, hat man ein Abo an der Backe. Warum gibt es kein monatlich kündbares Abo? Vom eigenem Produkt nicht überzeugt? Bevor es losgeht, schon so viele negative Gedanken.","at":"مجّانًا؟","ab":"يُقال إنّ العرض مجّانيّ، لكن عليّ أوّلًا الاشتراك اثني عشر شهرًا، ثمّ أحصل على سبعة أيّام مجّانية، وإن لم أُلغِ يعلق الاشتراك في رقبتي. لماذا لا يوجد اشتراك شهريّ قابل للإلغاء؟ ألستم واثقين من منتجكم؟ قبل أن أبدأ، وهذا كمٌّ من الأفكار السلبية."},{"n":13,"id":"13689778510","app":"babbel","country":"de","stars":5,"version":"21.92.0","date":"2026-01-29","title":"Anspruchsvoll","body":"Weihnachten habe ich den Lifetime Zugang gekauft. Seitdem, also seit 33 Tagen, habe ich 486 Lektionen beendet, da ich sehr schnell Französisch lernen muss. Die Lektionen sind anspruchsvoll, man lernt außer der Sprache auch noch nützliche andere Dinge, und gut strukturiert. Es ist eine SprachlernApp für Erwachsene. Mir macht das Sprachenlernen Spaß, ich brauche keine zusätzliche Motivation durch mehr oder weniger witzige Geschichten. Ich lerne parallel noch mit Gymglish, da ich damit auch schon Spanisch gelernt habe und das Abonnement noch ein Jahr läuft. Da wird die Grammatik sehr gut erklärt. Mir würde etwas fehlen, wenn ich nicht täglich meine Lektionen machen würde. Ich merke auch den Lernzuwachs, wenn ich abends französische Filme schaue. Vielen Dank an die Entwickler von Babbel, die eine Sprachlernsoftware entwickelt haben, die auf meine Art zu lernen zugeschnitten ist.","at":"متين","ab":"اشتريتُ في عيد الميلاد اشتراك مدى الحياة. ومنذ ذلك الحين، أي منذ 33 يومًا، أنهيتُ 486 درسًا لأنّي مضطرّ لتعلّم الفرنسية بسرعة. الدروس متينة، وتتعلّم إلى جانب اللغة أشياء أخرى مفيدة، وهي منظّمة جيّدًا. إنّه تطبيق تعلّم لغات للبالغين. أستمتع بتعلّم اللغات ولا أحتاج تحفيزًا إضافيًّا بنكات…"},{"n":14,"id":"9853306409","app":"rosetta","country":"nl","stars":3,"version":"8.23.0","date":"2023-04-23","title":"App draait ondersteboven","body":"Als de app start, draait het scherm ondersteboven. Kunnen jullie dat maken?","at":"التطبيق يعمل مقلوبًا","ab":"عند تشغيل التطبيق تنقلب الشاشة رأسًا على عقب. أيمكنكم إصلاح ذلك؟"},{"n":15,"id":"14144262062","app":"busuu","country":"us","stars":4,"version":"30.16.0","date":"2026-06-04","title":"yayy","body":"so this is such a good app but i don’t know if its free yet because i have only taken 2 lessons. i would add some lessons where you have to say the words so you get better on pronunciation. english not my first language so sorry if this doesn’t make sense 🫪🫪","at":"يااي","ab":"هذا تطبيق جيّد جدًّا لكنّي لا أعرف إن كان مجّانيًّا بعد لأنّي أخذتُ درسين فقط. كنتُ سأضيف دروسًا يُطلب فيها نطق الكلمات لتتحسّن في اللفظ. الإنجليزية ليست لغتي الأولى فاعذروني إن لم يكن كلامي مفهومًا 🫪🫪"},{"n":16,"id":"12022198326","app":"rosetta","country":"gb","stars":1,"version":"8.37.0","date":"2024-12-03","title":"Sign in broken since update","body":"I loved this app but I know am unable to sign in. I’ve download and redownloaded multiple times. Tried on mobile data and on WiFi and with VPN off and on and reset my password online. Shame as the app never used to be this buggy.","at":"تسجيل الدخول معطّل منذ التحديث","ab":"أحببتُ هذا التطبيق لكنّي الآن لا أستطيع تسجيل الدخول. حمّلتُه وأعدتُ تحميله مرّات. جرّبتُ ببيانات الجوّال وبالواي فاي، وبإطفاء VPN وتشغيله، وأعدتُ ضبط كلمة المرور من الموقع. مؤسف، فالتطبيق لم يكن بهذا العطب من قبل."},{"n":17,"id":"10650866366","app":"mondly","country":"gb","stars":5,"version":"10.13.0","date":"2023-12-02","title":"Helpful and intuitive","body":"A very helpful and intuitive app that is fun to use learning Greek. The different methods between matching words to pictures, typing words or even by speech whilst also having short converse with a bot are all useful functions. A fun way to repeat words and sentences over to learn the language with gamification. It would be nice if it went farther into stories as it would be something extra.","at":"مفيد وبديهيّ","ab":"تطبيق مفيد جدًّا وبديهيّ وممتع في تعلّم اليونانية. الطرق المختلفة — مطابقة الكلمات بالصور، أو كتابتها، أو حتّى بالنطق مع محادثة قصيرة مع روبوت — كلّها وظائف مفيدة. طريقة ممتعة لتكرار الكلمات والجمل وتعلّم اللغة باللعب. وكان جميلًا لو توسّع أكثر في القصص، فذلك شيء إضافيّ."},{"n":18,"id":"10812963660","app":"babbel","country":"lt","stars":5,"version":"21.40.1","date":"2024-01-12","title":"Чудово!","body":"Найкращий додаток, розбиті підтеми згідно рівня знань, відчуваю власний прогрес","at":"رائع!","ab":"أفضل تطبيق، المواضيع الفرعية مقسّمة حسب مستوى المعرفة، وأشعر بتقدّمي."},{"n":19,"id":"10021911773","app":"mondly","country":"gb","stars":3,"version":"10.2.0","date":"2023-06-11","title":"Good app, misleading free family spot","body":"I am enjoying the use of the app to support learning languages. It’s well thought out and the visual exercises are a valuable way to support learning. However, the premium subscription gives you a “free family spot” which I shared with my wife thinking oh this is going to be great value. It’s basically just a free 3 day trial though, not a free spot on a premium subscription. I hate apps that raise expectations and then try such dishonest tricks and such tactics are more likely to result in a cancelled subscription than a 2nd person signing up. I like the app and like how it offers pay monthly, but could do with a proper family plan and doesn’t seem to have one.","at":"تطبيق جيّد، لكنّ «المقعد العائليّ المجّانيّ» مضلّل","ab":"أستمتع باستعمال التطبيق لدعم تعلّم اللغات. إنّه مدروس جيّدًا، والتمارين البصرية طريقة قيّمة للدعم. لكنّ الاشتراك المميّز يمنحك «مقعدًا عائليًّا مجّانيًّا» شاركتُه مع زوجتي ظنًّا أنّ هذه قيمة رائعة. لكنّه في الحقيقة مجرّد تجربة مجّانية لثلاثة أيّام، لا مقعدًا مجّانيًّا في اشتراك مميّز. أكره التطبيقات التي ترفع التوقّعات ثمّ…"},{"n":20,"id":"11774745925","app":"babbel","country":"gb","stars":1,"version":"21.59.0","date":"2024-09-28","title":"Too expensive","body":"I was able to do one short session, then it asked for £89. “In app purchases” are usually tiny….but these are really expensive. Deleted.","at":"غالٍ جدًّا","ab":"استطعتُ إنهاء جلسة قصيرة واحدة، ثمّ طلب 89 جنيهًا. «المشتريات داخل التطبيق» عادةً صغيرة… لكنّ هذه غالية حقًّا. حذفتُه."},{"n":21,"id":"10186710927","app":"busuu","country":"nl","stars":3,"version":"27.21.0","date":"2023-07-26","title":"A good app to learn Dutch","body":"I like this app. Although, I would appreciate if we got more streak freezes because it’s kinda a boomer to restart a streak whenever you miss two days in a 14-day period. Also, the Community section (Discover and Friends) is notoriously slow! It takes over 10 seconds to load, that’s too slow. I don’t even bother anymore to review people’s exercises (nor do I expect anyone to review mine) because of how slow it is. Please fix it! I enjoy using this app to learn Dutch because it’s arranged in such a way that makes what you learn practical enough to use in real life almost immediately. The Review section can be used to quiz yourself or do spaced repetition exercises. Being able to see your own previously exercises in the Me section is a really nice way to see your progress from when you started to your current level. That can be surreal sometimes to literally hear/read how much you’ve grown! The very best part for me was the Dutch Pronunciation dedicated menu (don’t know if menu is the right word here). I was able to practice how to pronounce lob vowels, short vowels, schwa and others in parallel to other learning. Most other apps just mix the pronunciation part in the exercises but it’s nice that Busuu has a menu dedicated to it too. I could go back to it over and over again until I was sure I had nailed the pronunciation with it slowing my learning progress in other parts. It’s a good app! I will be happy if the Community section is resolved. And maybe we get to find friends by username.","at":"تطبيق جيّد لتعلّم الهولندية","ab":"يعجبني هذا التطبيق. لكنّي أتمنّى لو أعطونا «تجميدات سلسلة» أكثر، فمن المزعج أن تبدأ السلسلة من الصفر كلّما فوّتَ يومين خلال أربعة عشر يومًا. كذلك قسم المجتمع (اكتشف والأصدقاء) بطيء بشكل مشهور! يستغرق أكثر من عشر ثوانٍ للتحميل، وهذا بطيء جدًّا. لم أعد أكلّف نفسي عناء مراجعة تمارين الآخرين (ولا أتوقّع أن يراجع أحد تماريني) بسبب…"},{"n":22,"id":"12669521728","app":"memrise","country":"de","stars":1,"version":"2025.5.12","date":"2025-05-18","title":"Nicht durchdacht","body":"Ich möchte Spanisch lernen und bekomme in Deutschland eine Englische Übersetzung. Direkt wieder deinstalliert.","at":"غير مدروس","ab":"أريد تعلّم الإسبانية فأحصل في ألمانيا على ترجمة إنجليزية. حذفتُه فورًا."},{"n":23,"id":"14210336898","app":"busuu","country":"us","stars":3,"version":"30.18.0","date":"2026-06-21","title":"Mr Tom Schilling","body":"I am yet to have any of my exercises reviewed. Are there any other Dutch learners? Are there any Dutch native speakers? I can’t find any.","at":"السيّد توم شيلينغ","ab":"لم يُراجَع أيّ من تماريني حتّى الآن. هل يوجد متعلّمون آخرون للهولندية؟ هل يوجد ناطقون بالهولندية أصلًا؟ لا أجد أحدًا."},{"n":24,"id":"12010545163","app":"babbel","country":"nl","stars":1,"version":"21.63.0","date":"2024-11-30","title":"No yankees please","body":"I deliberately chose Babbel (being European / german) as opposed to duo Lingo not to hear Americans speak Spanish. Please either pick Spanish people speaking English to explain, or don’t explain. Yanks are irritating","at":"لا أمريكيّين من فضلكم","ab":"اخترتُ Babbel عمدًا (بصفتي أوروبيًّا/ألمانيًّا) بدل Duolingo كي لا أسمع أمريكيّين يتحدّثون الإسبانية. أرجو إمّا أن تختاروا إسبانًا يشرحون بالإنجليزية، أو ألّا تشرحوا أصلًا. الأمريكيّون مزعجون."},{"n":25,"id":"14430977326","app":"duolingo","country":"gb","stars":5,"version":"7.135.2","date":"2026-08-15","title":"Learn with fun 🥰","body":"I love this app!! Chinese is crazy difficult but this app can make it fun and easy. Highly recommend!!👍","at":"تعلّم بمتعة 🥰","ab":"أحبّ هذا التطبيق!! الصينية صعبة بجنون لكنّ هذا التطبيق يجعلها ممتعة وسهلة. أنصح به بشدّة!!👍"},{"n":26,"id":"13910592099","app":"busuu","country":"de","stars":5,"version":"30.7.0","date":"2026-04-01","title":"Bussu","body":"Sehr gut","at":"بوسو","ab":"جيّد جدًّا"},{"n":27,"id":"14417842758","app":"duolingo","country":"gb","stars":5,"version":"7.135.0","date":"2026-08-12","title":"Really good game","body":"I like the game because the interaction is good and learning languages are good","at":"لعبة جيّدة حقًّا","ab":"تعجبني اللعبة لأنّ التفاعل فيها جيّد وتعلّم اللغات جيّد"},{"n":28,"id":"12399905234","app":"rosetta","country":"cz","stars":1,"version":"8.41.0","date":"2025-03-09","title":"Voice recognition crazy bad","body":"I gave this app a try, looking to improve my Farsi. I had to repeat every word 20 times and I never got to a point where a voice sentence would be accepted properly. This garbage level of voice recognition is not acceptable for an app with this price tag in 2025. I spend a LOT of time with native farsi speakers, so I am very sure the problem is not on my end.","at":"التعرّف على الصوت سيّئ إلى حدّ الجنون","ab":"جرّبتُ هذا التطبيق لأحسّن الفارسية عندي. اضطررتُ لتكرار كلّ كلمة عشرين مرّة، ولم أصل قطّ إلى نقطة تُقبل فيها جملة منطوقة بشكل صحيح. مستوى التعرّف على الصوت الرديء هذا غير مقبول لتطبيق بهذا السعر في 2025. أقضي وقتًا طويلًا جدًّا مع ناطقين أصليّين بالفارسية، فأنا واثق تمامًا أنّ المشكلة ليست عندي."},{"n":29,"id":"14363080204","app":"duolingo","country":"de","stars":3,"version":"7.133.0","date":"2026-07-29","title":"Duolingo hilft schon 👍","body":"Es geht schnell und ist einfach.Dass einzige Problem ist dass sie viel zu aufdringlich sind und dass sie dich mental runtermachen wenn du nicht lernst.(Weiß nicht ob dass hilft oder vielleicht ok ist)Aber dass man eine eigene Figur hat und mit anderen Freunden lernen kann.(wie bei Snapchat { Flammen 🔥)Aber sonst gute App 👍","at":"Duolingo يساعد فعلًا 👍","ab":"سريع وسهل. المشكلة الوحيدة أنّهم مُلحّون أكثر من اللازم، وأنّهم يحطّونك نفسيًّا إن لم تتعلّم. (لا أدري أيساعد ذلك أم أنّه مقبول) لكن أن يكون لك شخصيّتك وأن تتعلّم مع أصدقاء (كما في سناب شات، الشعلة 🔥). وعدا ذلك تطبيق جيّد 👍"},{"n":30,"id":"11023430139","app":"rosetta","country":"gb","stars":1,"version":"8.31.3","date":"2024-03-08","title":"Dull","body":"Download this app….. then download duo lingo….. Now be honest and leave a review for which ones you keep and use…. I bet it’s duo lingo!!!! 100%","at":"مملّ","ab":"حمّل هذا التطبيق… ثمّ حمّل Duolingo… والآن كن صادقًا واكتب تقييمًا أيّهما أبقيتَ واستعملتَ… أراهن أنّه Duolingo!!!! مئة بالمئة."},{"n":31,"id":"14086179928","app":"pimsleur","country":"fi","stars":3,"version":"7.6.1","date":"2026-05-20","title":"Good but old","body":"I like the way Pimsleur teaches, but I feel it is getting very old, and has not been updated to modern standards. Like, it teaches you how to ask directions to reach a street in modern day of Google Maps, it teaches you to offer to pay in dollars instead of in euros in a french cafe (??) and it teaches you how to say ”No, I will pay you 12 euros, not 13!”, as if you would haggle in a French cafe! Some of these sentences feel like Duolingos infamous ”The boy has a red ball”. Sentences you will never use!","at":"جيّد لكنّه قديم","ab":"تعجبني طريقة Pimsleur في التعليم، لكنّي أشعر أنّه صار قديمًا جدًّا ولم يُحدَّث إلى المعايير الحديثة. مثلًا يعلّمك كيف تسأل عن الطريق إلى شارع في زمن خرائط جوجل، ويعلّمك أن تعرض الدفع بالدولار بدل اليورو في مقهى فرنسيّ (؟؟)، ويعلّمك أن تقول «لا، سأدفع لك 12 يورو لا 13!» وكأنّك تساوم في مقهى فرنسيّ!"},{"n":32,"id":"11506559281","app":"mondly","country":"tr","stars":3,"version":"10.27.0","date":"2024-07-18","title":"Any moment available great review opportunity","body":"You can work any time and review","at":"فرصة مراجعة رائعة في أيّ وقت","ab":"يمكنك العمل في أيّ وقت والمراجعة"},{"n":33,"id":"13240077663","app":"babbel","country":"nl","stars":4,"version":"21.84.0","date":"2025-10-08","title":"Great app with minor suggestions","body":"The app is overall great at what it does. It will not replace formal learning but it’s damn close. There are 2 important suggestions I could make: I’d love a widget that shows your streak as it helps remind and motivate me to practice daily and secondly, I’d love if there is a bit more repetition of language rules. I find that there is not enough emphasis on learning it and if you miss one it affects all future learning.","at":"تطبيق رائع مع اقتراحات بسيطة","ab":"التطبيق رائع عمومًا في ما يفعله. لن يحلّ محلّ التعليم النظاميّ لكنّه قريب جدًّا منه. لديّ اقتراحان مهمّان: أتمنّى أداة على الشاشة الرئيسية تعرض سلسلتي، فهي تذكّرني وتحفّزني على التدرّب يوميًّا؛ وثانيًا أتمنّى تكرارًا أكثر لقواعد اللغة. أجد أنّ التركيز على تعلّمها غير كافٍ، وإن فاتتك واحدة فإنّها تؤثّر…"},{"n":34,"id":"11968898808","app":"babbel","country":"pl","stars":2,"version":"21.62.2","date":"2024-11-19","title":"Brak połączenia z serwerami","body":"Wytłumaczy mi ktoś dlaczego co chwile nie ma połączenia z serwerami Babbel co uniemożliwia naukę kolejnych lekcji? Zapłaciłem za abonament a nie mogę korzystać…","at":"لا اتّصال بالخوادم","ab":"هل يشرح لي أحد لماذا ينقطع الاتّصال بخوادم Babbel كلّ لحظة فيمنعني من متابعة الدروس؟ دفعتُ ثمن الاشتراك ولا أستطيع الاستفادة…"},{"n":35,"id":"9645336522","app":"rosetta","country":"gb","stars":5,"version":"8.21.2","date":"2023-02-22","title":"Excellent value","body":"I decided to make the investment to pay for lifetime membership of Rosetta Stone . It’s excellent value for money when you think how much you get. The app is well designed and simple to use. Being able to use on my iPad is great and means theres no excuse for me not learning a new language.","at":"قيمة ممتازة","ab":"قرّرتُ أن أستثمر وأدفع ثمن عضوية مدى الحياة في Rosetta Stone. إنّها قيمة ممتازة مقابل المال حين تفكّر في حجم ما تحصل عليه. التطبيق مصمّم جيّدًا وسهل الاستعمال. وإمكانية استعماله على الآيباد رائعة وتعني ألّا عذر لي في عدم تعلّم لغة جديدة."},{"n":36,"id":"14350169659","app":"rosetta","country":"pl","stars":1,"version":"9.2.0","date":"2026-07-26","title":"Great method dramatically non functioning app","body":"If you use offline option forget about functionality. First of all in order to open the app you need internet connection. So if you thought that downloading the course will let you use it offline you’re almost wrong. It will if you open the app first while connected to the internet, then when you’re offline you will be able to access your course. Second, if you think your progress will be updated if you did some classes offline and you will be able to follow your progress again you’re almost wrong. It will and it will not. I’ve been using it for over two years. The way it saves the progress is a mystery probably even for the developer. Sometimes it does sometimes it doesn’t. Support is useless and also they don’t try to improve the app. Last thing again with the offline option forget to enter the chapters that you downloaded for offline use while you’re online. It will simply never load online. You have to switch your device to offline mode in order to do your downloaded content. That would be about it. It’s a really amazing learning method but the experience is broken because of the app.","at":"منهج رائع وتطبيق معطّل بشكل مأساويّ","ab":"إن استعملتَ خيار العمل دون إنترنت فانسَ أن يعمل. أوّلًا، لكي تفتح التطبيق تحتاج اتّصالًا بالإنترنت. فإن ظننتَ أنّ تنزيل الدورة سيتيح لك استعمالها دون اتّصال فأنت مخطئ تقريبًا. سيتيح ذلك إن فتحتَ التطبيق أوّلًا وأنت متّصل، ثمّ حين تنقطع تستطيع الوصول إلى دورتك. ثانيًا، إن ظننتَ أنّ تقدّمك سيُحدَّث…"},{"n":37,"id":"14403834209","app":"duolingo","country":"tr","stars":1,"version":"7.134.0","date":"2026-08-08","title":"Энергия","body":"Ладно, с бесконечной рекламой смирилась, но бесит энергия на 25 , максимум 3 урока пройти можно , как учиться в нем теперь? Хоть и жаль терять огонек в 2 года, но похоже придется перейти на более удобное приложение","at":"الطاقة","ab":"حسنًا، تصالحتُ مع الإعلانات اللانهائية، لكنّ الطاقة المحدّدة بـ25 تغيظني — ثلاثة دروس كحدّ أقصى، فكيف أتعلّم فيه الآن؟ ومع أنّي آسف على خسارة شعلة عمرها سنتان، يبدو أنّ عليّ الانتقال إلى تطبيق أكثر راحة."},{"n":38,"id":"12435240399","app":"drops","country":"gb","stars":5,"version":"38.62","date":"2025-03-18","title":"Fast and Simple","body":"A great way to increase your vocabulary in little gamified sessions!","at":"سريع وبسيط","ab":"طريقة رائعة لزيادة مفرداتك في جلسات صغيرة على هيئة لعبة!"},{"n":39,"id":"12462906076","app":"memrise","country":"se","stars":4,"version":"2025.3.12","date":"2025-03-25","title":"Good but used to be great","body":"This is one of the best language learning apps. Just really disappointed that you removed community courses from the app, it used to make you really unique and the idea of community courses was actually a really good idea.","at":"جيّد لكنّه كان رائعًا","ab":"هذا من أفضل تطبيقات تعلّم اللغات. خيبتي الحقيقية أنّكم أزلتم دورات المجتمع من التطبيق، فقد كانت تجعلكم فريدين حقًّا، وفكرة دورات المجتمع كانت فكرة جيّدة جدًّا في الواقع."},{"n":40,"id":"11547219460","app":"drops","country":"se","stars":3,"version":"38.35","date":"2024-07-29","title":"Spelling","body":"Still on beginner level but my first impression is overall good, however when trying to learn Thai it’s too many spelling questions in the checkpoint, and learning how to spell Thai is incredibly difficult and the focus first perhaps should be more towards listening and speaking for comprehension, then going into writing.","at":"الإملاء","ab":"ما زلتُ في المستوى المبتدئ لكنّ انطباعي الأوّل جيّد عمومًا، غير أنّي حين أحاول تعلّم التايلندية أجد أسئلة إملاء كثيرة جدًّا في نقطة التفتيش، وتعلّم إملاء التايلندية صعب بشكل لا يُصدَّق. وربّما كان الأولى أن يكون التركيز أوّلًا على الاستماع والكلام للفهم، ثمّ الانتقال إلى الكتابة."},{"n":41,"id":"12613485613","app":"drops","country":"nl","stars":1,"version":"38.67","date":"2025-05-02","title":"Drop the pictures","body":"Give me a way to drop the pictures or if it allready can make it easy to find how. I spent to much time learning which word belongs to a picture in my own language","at":"تخلّصوا من الصور","ab":"أعطوني طريقة لإلغاء الصور، أو إن كان ذلك ممكنًا فسهّلوا العثور عليها. أضعتُ وقتًا كثيرًا في تعلّم أيّ كلمة تخصّ أيّ صورة بلغتي أنا."},{"n":42,"id":"10617728062","app":"babbel","country":"gb","stars":5,"version":"21.40.0","date":"2023-11-23","title":"Getting there.","body":"I’m gradually getting there, it’s coming together.","at":"أتقدّم","ab":"أتقدّم شيئًا فشيئًا، والأمور تتّضح."},{"n":43,"id":"13067641399","app":"busuu","country":"nl","stars":2,"version":"29.16.0","date":"2025-08-27","title":"Last update made it horrible","body":"It was a perfect app, but since a recent update, somewhere mid june or early july, they’ve introduced robotic people voices and they just sound so bad that I don’t want to use it anymore. It was a good app, but this updated feature made it pretty bad.","at":"التحديث الأخير جعله فظيعًا","ab":"كان تطبيقًا مثاليًّا، لكن منذ تحديث أخير في منتصف يونيو أو بداية يوليو أدخلوا أصواتًا بشرية آلية، وهي سيّئة الوقع لدرجة أنّي لم أعد أريد استعماله. كان تطبيقًا جيّدًا، لكنّ هذه الميزة المحدَّثة جعلته سيّئًا جدًّا."},{"n":44,"id":"11625678123","app":"drops","country":"pl","stars":3,"version":"38.37","date":"2024-08-18","title":"Endless “sale” is a real problem","body":"Every time I want to open the app and start monthly subscription, I see a new “sale” forcing me to buy a early plan. Without option to get a monthly subscription. I will need the app for several months, why should a pay big money for the whole year?","at":"«التخفيض» الذي لا ينتهي مشكلة حقيقية","ab":"كلّما أردتُ فتح التطبيق وبدء اشتراك شهريّ، أرى «تخفيضًا» جديدًا يجبرني على شراء خطّة سنوية، دون خيار الاشتراك الشهريّ. سأحتاج التطبيق بضعة أشهر فقط، فلماذا أدفع مبلغًا كبيرًا لسنة كاملة؟"},{"n":45,"id":"13516805942","app":"busuu","country":"nl","stars":3,"version":"29.27.0","date":"2025-12-15","title":"Good but not so good","body":"Content, course material and structure is well done but the app itself executed poorly and can be frustrating for user. For example, if you have a typo you can’t just correct your error or add a missing word, you have to completely remove your response and write it back. There is a lag when you click in the sound to hear and when you hear it and the sound quality is not good, a bit low. For questions with multiple empty spaces to be filled, does not have submit button, as soon as you put the last word in place, it corrects you, giving no chance to review your answer.","at":"جيّد لكن ليس بذاك","ab":"المحتوى والمادّة التعليمية والبنية مصنوعة جيّدًا، لكنّ التطبيق نفسه منفَّذ تنفيذًا رديئًا وقد يكون محبطًا للمستخدم. مثلًا إن أخطأتَ في حرف لا تستطيع تصحيح خطئك أو إضافة كلمة ناقصة، بل عليك محو إجابتك كاملة وكتابتها من جديد. وهناك تأخّر بين ضغطك على الصوت وسماعك له، وجودة الصوت ليست جيّدة، منخفضة قليلًا. وبالنسبة للأسئلة…"},{"n":46,"id":"14421403512","app":"duolingo","country":"gb","stars":2,"version":"7.135.1","date":"2026-08-12","title":"energy..","body":"I have been using Duolingo consistently ever since 2023 and the progress on my language learning skills has somewhat been visible. However that is not my main issue I discuss. If you are wanting to download Duolingo don’t because it is near by IMPOSSIBLE! to get through a lesson without all your energy finishing. You can do ONE and next lesson you need to pay for more energy or watch advertisements.. smh.. I remember the old hearts which was actually way more helpful as it encourages not making mistakes. But energy on the other hand 🫩🫩🫩 so please if you wanna download this app just know your restricted to ONE lesson. AND AND AND Duolingo if you read this far bring back hearts it was a way better and way helpful system and you need to bring it back","at":"الطاقة..","ab":"أستعمل Duolingo بانتظام منذ 2023 وتقدّمي في مهارات اللغة كان ملحوظًا نوعًا ما. لكن ليست هذه مشكلتي الأساسية. إن كنتَ تنوي تحميل Duolingo فلا تفعل، لأنّه يكاد يكون مستحيلًا! أن تكمل درسًا دون أن تنفد طاقتك كلّها. تنهي درسًا واحدًا، وفي الدرس التالي عليك أن تدفع مقابل طاقة أكثر أو تشاهد إعلانًا."},{"n":47,"id":"13467111908","app":"drops","country":"lt","stars":1,"version":"38.84","date":"2025-12-02","title":"Не очень","body":"Зависает приложение","at":"ليس جيّدًا","ab":"التطبيق يتجمّد"},{"n":48,"id":"14242168385","app":"rosetta","country":"us","stars":2,"version":"9.2.0","date":"2026-06-29","title":"Speaking Questions","body":"I could literally have a native speaker repeat the sentence and it would still mark it as ‘red’ and not let them proceed. the settings are even on low, it’s extremely aggravating.","at":"أسئلة النطق","ab":"أستطيع حرفيًّا أن أجعل ناطقًا أصليًّا يكرّر الجملة ومع ذلك يضعها حمراء ولا يسمح له بالمتابعة. حتّى والإعدادات على المستوى المنخفض. هذا مثير للغيظ إلى أقصى حدّ."},{"n":49,"id":"14308987384","app":"duolingo","country":"se","stars":5,"version":"7.131.0","date":"2026-07-15","title":"Lär mig super mycket","body":"Jag har lärt mig massor av spanska! Älskar appen! Jag rekommenderar till alla som vill lära sig ett språk!!!!!!❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️","at":"أتعلّم كثيرًا جدًّا","ab":"تعلّمتُ كمًّا هائلًا من الإسبانية! أعشق التطبيق! أنصح به كلّ من يريد تعلّم لغة!!!!!!❤️❤️❤️❤️❤️"},{"n":50,"id":"11726079760","app":"drops","country":"gb","stars":2,"version":"38.40","date":"2024-09-15","title":"sad that you have to pay","body":"downloaded because I was just searching the App Store for language learning apps. Started learning, did a five minute lesson. The learning was fine, although it was a bit weird how the pictures had to mean something, like the picture for hello is similar to the picture for thank you, etc. Anyway, went to complete another lesson and it said I had to wait ten hours to do another lesson or I had to pay. Pretty annoying, can’t learn until half a day has past. I even initially set a goal to have 15min learning everyday but apparently I’m only allowed 5min. Won’t be using anymore, would’ve been great if I could learn for longer without paying ten pound per month.","at":"محزن أن يكون عليك الدفع","ab":"حمّلتُه لأنّي كنتُ أبحث في المتجر عن تطبيقات تعلّم لغات. بدأتُ التعلّم وأنهيتُ درسًا من خمس دقائق. التعلّم كان جيّدًا، وإن كان غريبًا قليلًا أن تحمل الصور معاني، فصورة «مرحبًا» تشبه صورة «شكرًا» وهكذا. على أيّ حال، ذهبتُ لإكمال درس آخر فقال إنّ عليّ الانتظار عشر ساعات لدرس آخر أو أن أدفع…"},{"n":51,"id":"14323587852","app":"pimsleur","country":"se","stars":5,"version":"7.8","date":"2026-07-19","title":"En väldigt bra app för att lära sig japanska på 🇯🇵💞","body":"10/10","at":"تطبيق جيّد جدًّا لتعلّم اليابانية 🇯🇵💞","ab":"10/10"},{"n":52,"id":"14403500451","app":"duolingo","country":"de","stars":3,"version":"7.134.0","date":"2026-08-08","title":"Super Idee mit ein paar massiven Schwächen","body":"Diese Bewertung gilt dem Modul französisch. Eigentlich ist die App super die Idee ist toll und sie hilft am Ball zu bleiben. Was aber massiv demotivieren wirkt, sind für mich folgende Dinge: wenn man sprechübungen mit Timer macht, tut sich die App oft so schwer, ein Wort zu verstehen, dass sie es nicht annimmt und man damit die Challenges nicht schaffen kann. Bitte arbeitet an einem besseren Hörverstehen der App. Zum anderen werden ganz viele Wörter nie wiederholt, dafür muss man ständig Ländernamen, Ausdrücke wie „uff“ und „ah“ und „oh je“ wiederholen, die man nun wirklich nicht unbedingt braucht. Bitte konzentriert euch auf Verben Präpositionen etc. und wiederholt die Worte nach Schwierigkeit und Wichtigkeit und danach, wie gut man sie kann. Das dritte ist, dass man keinerlei Konjugation üben kann, sich die Wörter nicht merken kann, die einem schwer fallen, so dass man sie wiederholen kann und dass man Verben nicht separat üben kann in den verschiedenen Zeiten und Konjugation. Seit kurzem habt ihr die Stimmen verändert, zb beim französischen Junior und beim Vorleser. Die Stimmen in den Geschichten waren toll, es wäre so schön, wenn sie wiederkommen. Das Vorlesen war früher auf französisch und ist jetzt auf Deutsch. Französisch war viel besser, Deutsch kann ich ja schon… vielleicht könnte man einfach eine deutsche textuelle Übersetzung dazu anzeigen, aber die Sprache auf französisch erhalten? Toll ist, dass es jetzt wenigstens endlich Vokabeln Challenges gibt. vielen Dank dafür und dafür, dass ihr euch so viel Mühe mit der Weiterentwicklung gebt!!!","at":"فكرة رائعة بنقاط ضعف هائلة","ab":"هذا التقييم لوحدة الفرنسية. التطبيق في الأصل رائع والفكرة عظيمة وتساعد على المواظبة. لكنّ ما يُحبط بشدّة عندي هو التالي: حين تؤدّي تمارين النطق بمؤقّت، يصعب على التطبيق كثيرًا أن يفهم كلمة فلا يقبلها، فلا تستطيع إنجاز التحدّيات. أرجو أن تعملوا على تحسين الاستماع…"},{"n":53,"id":"14110595670","app":"busuu","country":"tr","stars":2,"version":"29.30.0","date":"2026-05-26","title":"Premium","body":"25 mayıs 2026 da 12 aylık premium üyeliği satın aldım .bu sabah konuşma pratiğimde “ücretsiz erişim sona erdi “ uyarısı veriyor.nasıl çözmem gerek?","at":"بريميوم","ab":"اشتريتُ في 25 مايو 2026 عضوية مميّزة لاثني عشر شهرًا. هذا الصباح يظهر لي في تدريب المحادثة تنبيه «انتهى الوصول المجّانيّ». كيف يُفترض أن أحلّ هذا؟"},{"n":54,"id":"14424370821","app":"duolingo","country":"us","stars":5,"version":"7.135.1","date":"2026-08-13","title":"Duolingo review","body":"The only thing that is bad is the ads after every lesson I get that there is a no add plan but for the free one it should be like every three lessons you get an add.","at":"تقييم Duolingo","ab":"الشيء السيّئ الوحيد هو الإعلانات بعد كلّ درس. أفهم أنّ هناك خطّة بلا إعلانات، لكن في النسخة المجّانية ينبغي أن يكون الإعلان كلّ ثلاثة دروس مثلًا."},{"n":55,"id":"12190726725","app":"pimsleur","country":"no","stars":5,"version":"5.14","date":"2025-01-16","title":"Great app! One small suggestion.","body":"Started learning Norwegian with the app and so far so good! Only suggestion i have is to able to use the app in the landscape orientation on iPad. I use keyboard and mouse with iPad like it’s a laptop so it would be nice to not have to prop-up my iPad in the portrait orientation when i use this app.","at":"تطبيق رائع! واقتراح صغير.","ab":"بدأتُ تعلّم النرويجية بالتطبيق وحتّى الآن كلّ شيء جيّد! اقتراحي الوحيد أن يُتاح استعمال التطبيق بالوضع الأفقيّ على الآيباد. أستعمل الآيباد بلوحة مفاتيح وفأرة كأنّه حاسوب محمول، فمن الجميل ألّا أضطرّ لنصبه عموديًّا حين أستعمل هذا التطبيق."},{"n":56,"id":"13470608631","app":"drops","country":"us","stars":5,"version":"38.84","date":"2025-12-03","title":"Love this app!","body":"This is the first and only app I’ve ever rated but they deserve my time to do this. I’ve been using Drops for many, many years and it is just a fantastic way to learn new vocabulary. I’ve gone through thousands of words but there’s still more and I’m so grateful!","at":"أحبّ هذا التطبيق!","ab":"هذا أوّل وآخر تطبيق قيّمتُه في حياتي، لكنّهم يستحقّون وقتي. أستعمل Drops منذ سنوات كثيرة جدًّا وهو طريقة رائعة لتعلّم مفردات جديدة. مررتُ بآلاف الكلمات وما زال هناك المزيد، وأنا ممتنّ جدًّا!"},{"n":57,"id":"14430558795","app":"duolingo","country":"us","stars":1,"version":"7.135.2","date":"2026-08-15","title":"Scam app that doesn’t actually teach you a language","body":"All it does is make you sign up for a trial hoping you’d forget to cancel. You can be on this app for years and you’ll never learn a new language fluently","at":"تطبيق نصب لا يعلّمك لغة فعلًا","ab":"كلّ ما يفعله أن يجعلك تشترك في تجربة مجّانية على أمل أن تنسى الإلغاء. يمكنك أن تبقى في هذا التطبيق سنوات ولن تتعلّم لغة جديدة بطلاقة أبدًا."},{"n":58,"id":"11957213219","app":"rosetta","country":"gb","stars":1,"version":"8.36.0","date":"2024-11-16","title":"Doesn’t work half the time","body":"Always glitches, and doesn’t work half the time. Don’t recommend .","at":"لا يعمل نصف الوقت","ab":"يتعطّل دائمًا، ولا يعمل نصف الوقت. لا أنصح به."},{"n":59,"id":"13851649452","app":"drops","country":"us","stars":5,"version":"39.3","date":"2026-03-15","title":"Good for first time learners!","body":"I used this app a month before visiting Philippines and Japan and ended up learning conversational communication in Tagalog and Japanese! It was perfect for travel.","at":"جيّد للمتعلّمين لأوّل مرّة!","ab":"استعملتُ هذا التطبيق شهرًا قبل زيارة الفلبّين واليابان، وانتهى بي الأمر متعلّمًا تواصلًا محادثيًّا بالتاغالوغية واليابانية! كان مثاليًّا للسفر."},{"n":60,"id":"13348364195","app":"busuu","country":"no","stars":5,"version":"29.23.0","date":"2025-11-02","title":"Variert læring","body":"Konseptet som Busuu baserer seg på: Noen ord av gangen, korte setninger, valg av rett/galt, skrive litt og snakke litt. For meg er det en god miks for å lære språk, og nå fokuserer jeg på polsk.","at":"تعلّم متنوّع","ab":"المفهوم الذي يقوم عليه Busuu: بضع كلمات في المرّة، جمل قصيرة، اختيار صحيح/خطأ، كتابة قليلة وكلام قليل. بالنسبة لي مزيج جيّد لتعلّم اللغات، وأنا الآن أركّز على البولندية."},{"n":61,"id":"11640812295","app":"mondly","country":"pl","stars":5,"version":"10.29.1","date":"2024-08-22","title":"fajna aplikacja","body":"da się nauczyć","at":"تطبيق لطيف","ab":"يمكن التعلّم به"},{"n":62,"id":"13356063375","app":"busuu","country":"pl","stars":1,"version":"29.24.0","date":"2025-11-04","title":"Duolingo much better","body":"It logged me out from the app after the upgrade. In Duolingo they have better app developers, never log me out. For few minutes I had a new version with floating screen, on iPhone mini it was a nightmare. Luckily new upgrade corrected it. Why are you pushing your customers into Duolingo.","at":"Duolingo أفضل بكثير","ab":"أخرجني من حسابي بعد الترقية. في Duolingo مطوّرو تطبيقات أفضل، لا يخرجونني أبدًا. ولدقائق كانت عندي نسخة جديدة بشاشة عائمة، وعلى iPhone mini كانت كابوسًا. لحسن الحظّ صحّحتها ترقية جديدة. لماذا تدفعون زبائنكم إلى Duolingo؟"},{"n":63,"id":"14227326022","app":"duolingo","country":"nl","stars":5,"version":"7.128.1","date":"2026-06-25","title":"Leuk leren en leuk te doen","body":"Erg leuke leer spel voor talen, de beste van alle.","at":"تعلّم ممتع وممارسة ممتعة","ab":"لعبة تعلّم لغات ممتعة جدًّا، الأفضل بينها كلّها."},{"n":64,"id":"10907480065","app":"rosetta","country":"nl","stars":3,"version":"8.30.0","date":"2024-02-05","title":"Disturbing","body":"I use it on my iPad, I can't complete some parts despite having done the whole assignment correctly, and then I also can't go to the following lesson. Quite annoying.","at":"مزعج","ab":"أستعمله على الآيباد، ولا أستطيع إكمال بعض الأجزاء رغم أنّي أدّيتُ التمرين كلّه صحيحًا، ثمّ لا أستطيع الانتقال إلى الدرس التالي. مزعج تمامًا."},{"n":65,"id":"9882001977","app":"rosetta","country":"se","stars":5,"version":"8.23.0","date":"2023-05-01","title":"Amazing","body":"I liked it , it is easy to learn and practice. Specially it is cheap when you decided to buy as lifetime. One time payments and enjoy learning how many languages you want.","at":"مذهل","ab":"أعجبني، سهل التعلّم والتدرّب. وخاصّة أنّه رخيص حين تقرّر الشراء مدى الحياة. دفعة واحدة واستمتع بتعلّم ما شئت من اللغات."},{"n":66,"id":"14374300989","app":"duolingo","country":"se","stars":3,"version":"7.133.0","date":"2026-08-01","title":"Bra språkutbildning","body":"Bra exempel men jag saknar svenska som första språk vilket gör att jag får fel både på språket jag lär mig och engelska. Töntiga ljudeffekter kommer upp mellan klasserna. De borde tas bort.","at":"تعليم لغات جيّد","ab":"أمثلة جيّدة لكن تنقصني السويدية كلغة أولى، ممّا يجعلني أخطئ في اللغة التي أتعلّمها وفي الإنجليزية معًا. وتظهر مؤثّرات صوتية سخيفة بين الدروس، ينبغي إزالتها."},{"n":67,"id":"14148841012","app":"memrise","country":"us","stars":2,"version":"2026.5.27","date":"2026-06-05","title":"Used to Be Good - No Support","body":"Disorganised app, sort of seems abandoned. Here's the text of a ticket I've opened twice to no response: There is no 'Memrise Shorts' tab in the videos section (iOS). And please just pay your employees to do videos--not only is it a mixed bag (one had animal abuse and extreme violence against women), it seems super sketch to be using YouTuber's videos to pad the app without their permission.","at":"كان جيّدًا — لا دعم","ab":"تطبيق غير منظّم، يبدو متروكًا نوعًا ما. وهذا نصّ تذكرة فتحتُها مرّتين دون ردّ: لا يوجد تبويب «Memrise Shorts» في قسم الفيديوهات (iOS). وأرجو أن تدفعوا لموظّفيكم ليصنعوا الفيديوهات — فهي ليست متفاوتة فحسب (أحدها فيه تعذيب حيوانات وعنف شديد ضدّ النساء)، بل يبدو مريبًا جدًّا أن تستعملوا فيديوهات صنّاع محتوى لحشو التطبيق دون…"},{"n":68,"id":"12501448512","app":"mondly","country":"lt","stars":3,"version":"10.46.0","date":"2025-04-03","title":"Отзыв","body":"Очень маленький ежедневный урок в связи с чем обучение идет очень медленно! Для существенного прогресса нужно чтобы урок шел не менее часа. Еще не нравится ограничение на ежимесечный повтор, этот повтор дает много очков и увеличивает время урока, а вы его ограничиваете и не даете очки!","at":"تقييم","ab":"الدرس اليوميّ صغير جدًّا، ولذلك يسير التعلّم ببطء شديد! لتقدّم ملموس يجب أن يكون الدرس ساعة على الأقلّ. ولا يعجبني أيضًا تحديد المراجعة الشهرية؛ فهذه المراجعة تعطي نقاطًا كثيرة وتطيل زمن الدرس، وأنتم تحدّونها ولا تعطون النقاط!"},{"n":69,"id":"12677181007","app":"busuu","country":"gb","stars":2,"version":"29.4.0","date":"2025-05-20","title":"Learning behind paywall","body":"It’s a shame that this app appears to be a fun and free language learning app. I was having a great time learning in my first week, with no ads whatsoever. Shortly after, an ad would appear after every lesson. I still didn’t purchase the premium as it’s not within my budget. However, as you process and become attached to the learning and modules, the app introduces more and more ads. There is now an ad before and after every single 2 minute lesson. It has no ads to get you hooked then introduces tons of ads to get you to pay. A shame.","at":"التعلّم خلف جدار الدفع","ab":"من المؤسف أنّ هذا التطبيق يبدو تطبيق تعلّم لغات ممتعًا ومجّانيًّا. قضيتُ أسبوعي الأوّل في تعلّم رائع بلا إعلانات إطلاقًا. وبعد قليل صار الإعلان يظهر بعد كلّ درس. ومع ذلك لم أشترِ النسخة المميّزة لأنّها خارج ميزانيّتي. لكن كلّما تقدّمتَ وتعلّقتَ بالتعلّم والوحدات، أدخل التطبيق المزيد والمزيد…"},{"n":70,"id":"10057636438","app":"drops","country":"pl","stars":2,"version":"36.67","date":"2023-06-21","title":"Non correct Swedish translation","body":"I ran this app with my Swedish friend and he said your translation on some words and phrases is not correct. Like for example: “Jag luktar pa vinet” - “I’m smelling the wine”. Which you translated like “I’m feeling the smell” lol Please, learn language at first before teaching other people it.","at":"ترجمة سويدية غير صحيحة","ab":"شغّلتُ هذا التطبيق مع صديقي السويديّ فقال إنّ ترجمتكم لبعض الكلمات والعبارات غير صحيحة. مثلًا: «Jag luktar på vinet» — «أشمّ رائحة النبيذ»، وأنتم ترجمتموها «أشعر بالرائحة» هههه. أرجوكم تعلّموا اللغة أوّلًا قبل أن تعلّموها للناس."},{"n":71,"id":"12751985462","app":"memrise","country":"us","stars":3,"version":"2025.5.12","date":"2025-06-08","title":"Great material","body":"The app has great material and is easy to use. It’s just hard to really understand the dialect when it is said through a speaker instead of in person.","at":"مادّة رائعة","ab":"في التطبيق مادّة رائعة وهو سهل الاستعمال. المشكلة فقط أنّ من الصعب فهم اللهجة حقًّا حين تُنطق عبر مكبّر صوت بدل أن تكون مباشرة من شخص."},{"n":72,"id":"10912200452","app":"memrise","country":"ee","stars":3,"version":"2024.2.3","date":"2024-02-07","title":"Useless after latest update","body":"The update on Feb. 7, 2024, makes Memrise completely useless for me now. The language I was studying (Estonian) was only available as a community course. Since the app doesn’t allow community courses, it’s now useless. I have been using the app almost every day for years, and now I have to say goodbye forever, Memrise.","at":"بلا فائدة بعد التحديث الأخير","ab":"تحديث 7 فبراير 2024 جعل Memrise عديم الفائدة تمامًا بالنسبة لي. اللغة التي كنتُ أدرسها (الإستونية) كانت متاحة فقط كدورة مجتمع. وبما أنّ التطبيق لم يعد يسمح بدورات المجتمع، فقد صار عديم الفائدة. كنتُ أستعمله يوميًّا تقريبًا لسنوات، والآن عليّ أن أقول وداعًا إلى الأبد يا Memrise."},{"n":73,"id":"13695533130","app":"rosetta","country":"us","stars":1,"version":"8.43.2","date":"2026-01-30","title":"Never works","body":"This app just is in constant spin mode and does not load any lessons. I have tried it for a very very long time same thing. On different iPad etc. No support at all on this issue. I have paid for lifetime membership and then nothing.","at":"لا يعمل أبدًا","ab":"هذا التطبيق في حالة دوران مستمرّ ولا يحمّل أيّ درس. جرّبتُه مدّة طويلة جدًّا جدًّا وبالنتيجة نفسها، وعلى آيباد مختلف وغيره. ولا دعم إطلاقًا في هذه المشكلة. دفعتُ ثمن عضوية مدى الحياة ثمّ لا شيء."},{"n":74,"id":"12145114925","app":"mondly","country":"se","stars":4,"version":"10.40.2","date":"2025-01-04","title":"Mondly","body":"4 stjärnor för att det kostar pengar efter 7 dagar men annars om det inte hade kostat pengar efter 7 dagar hade det varit 5 stjärnor","at":"موندلي","ab":"أربع نجوم لأنّه يصير مدفوعًا بعد سبعة أيّام، وإلّا لو لم يكن مدفوعًا بعد سبعة أيّام لأعطيتُه خمسًا."},{"n":75,"id":"14313408061","app":"duolingo","country":"se","stars":5,"version":"7.131.0","date":"2026-07-17","title":"Super bra mega bra pendling bra för mig jag lär mig jätte mycket","body":"Jag satte på så jag ska träna spanska varje dag KL 10 nu på sommar lovet och det är super roligt och bra jag sparar på min karriär om jag ska bo i Spanien någon gång eller något eller börja på någon annan sport","at":"ممتاز جدًّا، رائع جدًّا، وجيّد لي، أتعلّم كثيرًا جدًّا","ab":"ضبطتُه لأتدرّب على الإسبانية كلّ يوم الساعة العاشرة في العطلة الصيفية، وهو ممتع جدًّا وجيّد. أدّخر لمستقبلي إن أردتُ السكن في إسبانيا يومًا أو ما شابه، أو بدء رياضة أخرى."},{"n":76,"id":"14372838497","app":"drops","country":"us","stars":4,"version":"39.16","date":"2026-07-31","title":"Would give 5 stars except for one thing...","body":"This is a great vocabulary app and a good supplement to my Dreaming Spanish routine. However, I would like to be able to count my time spent with it, and there is no way to do so. There is no way to see how many sessions I completed in a given day. There is no way to see how much time I spent learning in the app. I can't even see the little diagram comparing the last 7 days / 30 days / 90 days unless I spend time on another session and see that chart during the review. I really like having that data available. If they will fix this issue, I will happily revise my review.","at":"كنتُ سأعطي خمس نجوم لولا شيء واحد…","ab":"هذا تطبيق مفردات رائع ومكمّل جيّد لروتيني في Dreaming Spanish. لكنّي أودّ لو أستطيع حساب الوقت الذي أقضيه فيه، ولا سبيل إلى ذلك. لا سبيل لمعرفة كم جلسة أنجزتُ في يوم. ولا سبيل لمعرفة كم من الوقت قضيتُ في التعلّم داخل التطبيق. ولا أستطيع حتّى رؤية الرسم الصغير الذي يقارن آخر سبعة أيّام…"},{"n":77,"id":"10897145648","app":"memrise","country":"gb","stars":5,"version":"2024.2.1","date":"2024-02-03","title":"Great but…","body":"I absolutely love this app and I wouldn’t change anything about it. I am however having a lot of trouble trying to start the next course. I have just finished Italian 1 and I’ve been trying to figure out how to start Italian 2","at":"رائع لكن…","ab":"أحبّ هذا التطبيق حبًّا شديدًا ولا أغيّر فيه شيئًا. لكنّي أواجه صعوبة كبيرة في بدء الدورة التالية. أنهيتُ للتوّ «الإيطالية 1» وأحاول أن أفهم كيف أبدأ «الإيطالية 2»."},{"n":78,"id":"10021648106","app":"mondly","country":"nl","stars":5,"version":"10.2.0","date":"2023-06-11","title":"Hele goeie app!","body":"Hele goeie uitgebreide app! Heb Duolingo ook even uitgeprobeerd maar deze is toch echt wel fijner, prettiger, vriendelijker en zit volgens mij beter in elkaar. Ook kan je vanuit Nederlands vele talen leren. Zit nu in m’n proefperiode maar ga dit zeker verlengen! Een echte aanrader!","at":"تطبيق جيّد جدًّا!","ab":"تطبيق جيّد جدًّا وشامل! جرّبتُ Duolingo قليلًا لكنّ هذا في الحقيقة أمتع وأريح وألطف وأرى أنّه مبنيّ بشكل أفضل. وتستطيع أيضًا تعلّم لغات كثيرة انطلاقًا من الهولندية. أنا الآن في فترة التجربة وسأمدّدها بالتأكيد! أنصح به حقًّا!"},{"n":79,"id":"12445904242","app":"drops","country":"gb","stars":1,"version":"38.62","date":"2025-03-21","title":"Problems!","body":"Still showing ads asking me to subscribe even after paying (evidence my bank statement) and it won’t accept my iPhone mic input so got nowhere with it I’m afraid","at":"مشاكل!","ab":"ما زال يعرض إعلانات تطلب منّي الاشتراك حتّى بعد أن دفعتُ (والدليل كشف حسابي البنكيّ)، ولا يقبل مدخل ميكروفون الآيفون عندي، فلم أصل معه إلى شيء للأسف."},{"n":80,"id":"13287427696","app":"rosetta","country":"us","stars":4,"version":"8.43.0","date":"2025-10-19","title":"Almost perfect","body":"This is by far my favorite language learning app. I like that I’m taught by just being thrown into the language I’m learning and there’s nothing in my native language. I feel I have the most success with this app. However, the portions where I speak and it has to recognize my speech is absolutely useless. It has never worked. Half the time it doesn’t even recognize that I’m speaking. Sometimes it even switches back and forth between which speaker it’s speaking through in my phone. (I’m using an apple phone.) Otherwise, it’s a great program. But this one feature is 100% dysfunctional and useless.","at":"شبه مثاليّ","ab":"هذا بلا منازع تطبيقي المفضّل لتعلّم اللغات. يعجبني أن يعلّمني بأن يرميني في اللغة التي أتعلّمها مباشرة دون أيّ شيء بلغتي الأمّ. أشعر أنّ نجاحي معه هو الأكبر. لكنّ الأجزاء التي أتكلّم فيها ويُفترض أن يتعرّف على كلامي عديمة الفائدة تمامًا. لم تعمل قطّ. ونصف الوقت لا يدرك حتّى أنّي أتكلّم…"},{"n":81,"id":"13417960968","app":"rosetta","country":"us","stars":3,"version":"8.43.2","date":"2025-11-19","title":"Difficult","body":"Hard to know what they want","at":"صعب","ab":"من الصعب معرفة ما الذي يريدونه"},{"n":82,"id":"11680369297","app":"drops","country":"gb","stars":4,"version":"38.38","date":"2024-09-02","title":"useful!","body":"I was planning to learn European Portuguese through Duolingo however the app only taught Brazilian Portuguese! So instead i downloaded this app and found that it’s very useful! The only downside is that you’re only going to properly and thoroughly improve your language skills if you get premium which is quite expensive. If you download premium, you’ll notice that your skills will improve quite fast. There’s no ads, more content, unlimited learning time and more. I understand that it’s how they make a profit and honestly i don’t blame them.. but the price is quite high! Apart from that the app is great and very helpful if you choose to learn a language fast.","at":"مفيد!","ab":"كنتُ أنوي تعلّم البرتغالية الأوروبية عبر Duolingo لكنّ التطبيق لا يعلّم إلّا البرتغالية البرازيلية! فحمّلتُ هذا التطبيق بدلًا منه ووجدتُه مفيدًا جدًّا! العيب الوحيد أنّك لن تحسّن مهاراتك اللغوية بشكل صحيح وشامل إلّا إن اشتريتَ النسخة المميّزة، وهي غالية نوعًا ما. وإن حمّلتَ المميّزة ستلاحظ أنّ…"},{"n":83,"id":"10469765737","app":"rosetta","country":"se","stars":1,"version":"8.26.0","date":"2023-10-13","title":"Canceling is a train wreck","body":"I didn’t mind the app, it was easy to sign up and it worked well. However, not only is there an automatic auto renew on your subscription, you also need a computer to do anything that has to do with cancelling. Having people sign up for a mobile app on their phone, but not letting them cancel? That is NOT an okay business practice. Shame on you guys! I will NOT be recommending this app.","at":"الإلغاء كارثة","ab":"لم أمانع التطبيق، كان التسجيل سهلًا وعمل جيّدًا. لكن ليس فقط أنّ هناك تجديدًا تلقائيًّا لاشتراكك، بل تحتاج أيضًا إلى حاسوب لتفعل أيّ شيء يتعلّق بالإلغاء. أن تجعل الناس يشتركون في تطبيق جوّال من هواتفهم ثمّ لا تدعهم يلغون منها؟ هذه ليست ممارسة تجارية مقبولة. عار عليكم! ولن أنصح…"},{"n":84,"id":"13815235328","app":"rosetta","country":"us","stars":5,"version":"8.43.5","date":"2026-03-04","title":"Mr. Polanco","body":"I learned English thanks to Rosetta Stone that gave me the basics. Now I’m encouraging my Spanish students to use it and learn as many languages as they can! Thank you RS!!!!!","at":"السيّد بولانكو","ab":"تعلّمتُ الإنجليزية بفضل Rosetta Stone الذي أعطاني الأساسيات. والآن أشجّع طلّابي الإسبان على استعماله وتعلّم أكبر عدد ممكن من اللغات! شكرًا RS!!!!"},{"n":85,"id":"14434307487","app":"busuu","country":"de","stars":5,"version":"30.22.0","date":"2026-08-16","title":"Spanisch","body":"Großartige App - habe viel gelernt und es macht sehr vielen Spaß - am besten finde es ch die top aktuellen Themenkomplexe ! Großartig !","at":"الإسبانية","ab":"تطبيق عظيم — تعلّمتُ الكثير وهو ممتع جدًّا. وأفضل ما فيه عندي مجموعات المواضيع الحديثة جدًّا! عظيم!"},{"n":86,"id":"14129701049","app":"busuu","country":"us","stars":5,"version":"30.15.0","date":"2026-05-31","title":"Spent a year with the Green Owl, I should’ve been here!","body":"In fall 2024 during a trip to Munich, I embarked on the goal of learning German. I spent a year of practicing every day with the competition, and while it was fantastic for my vocabulary, it provided barely any context to grammar and why when I’d actually say something. Well Busuu is different and in the best way possible. It’s like Duo for adults, with quick blurbs about the grammatical rules behind it. I’ve learned more about German grammar in two weeks than I have in a year with the other guy. So I’m here to stay, because I’ve been seriously impressed.","at":"قضيتُ سنة مع البومة الخضراء، كان يجب أن أكون هنا!","ab":"في خريف 2024 وأثناء رحلة إلى ميونخ، بدأتُ هدف تعلّم الألمانية. قضيتُ سنة أتدرّب يوميًّا مع المنافس، ومع أنّه كان رائعًا لمفرداتي، فإنّه لم يعطِ أيّ سياق تقريبًا للقواعد ولا لسبب قولي شيئًا بعينه. أمّا Busuu فمختلف، وبأفضل شكل ممكن. إنّه مثل Duo لكن للبالغين، بشروح سريعة و…"},{"n":87,"id":"10818964102","app":"rosetta","country":"de","stars":3,"version":"8.29.0","date":"2024-01-13","title":"Spracherkennung","body":"An und für sich finde ich die App wirklich gut, die Spracherkennung treibt mich jedoch an den Rand des Wahnsinns. Es ist unglaublich frustrierend wenn man in einem Moment gut verstanden wird und im darauffolgenden von 10 Versuchen 0-1 mal verstanden wird was man sagt. Ich würde mir die App an sich gerne kaufen, aber die Spracherkennung hält mich davon ab. Ich habe gerade andere Rezensionen gelesen die dieses Problem auch beschreiben und schon um Jahre älter sind. Ich verstehe nicht warum das Problem nicht behoben wird.","at":"التعرّف على الكلام","ab":"التطبيق في ذاته جيّد حقًّا في رأيي، لكنّ التعرّف على الكلام يدفعني إلى حافّة الجنون. من المحبط بشكل لا يُصدّق أن تُفهم جيّدًا في لحظة، ثمّ في اللحظة التالية لا يُفهم كلامك إلّا مرّة أو صفرًا من عشر محاولات. أودّ شراء التطبيق فعلًا، لكنّ التعرّف على الكلام يمنعني."},{"n":88,"id":"13316701962","app":"busuu","country":"gb","stars":2,"version":"29.21.0","date":"2025-10-26","title":"Not too bad","body":"It’s better than some apps for learning Spanish but not the greatest. It is very fussy on pronunciation, like too fussy. It appears to nit pick on the smallest things. Like we are doing a whole phrase and get criticised on one letter. Doesn’t build confidence.","at":"ليس سيّئًا","ab":"أفضل من بعض تطبيقات تعلّم الإسبانية لكنّه ليس الأروع. إنّه شديد التدقيق في النطق، شديد أكثر من اللازم. يبدو أنّه يتصيّد أصغر الأشياء؛ نؤدّي عبارة كاملة فيُنتقد حرف واحد فيها. هذا لا يبني الثقة."},{"n":89,"id":"12623221104","app":"memrise","country":"tr","stars":5,"version":"2025.4.25","date":"2025-05-05","title":"FAYDALI","body":"Çok faydalı bir program.Kullanılan teknik,akılda kalıcılığı çok destekliyor","at":"مفيد","ab":"برنامج مفيد جدًّا. التقنية المستعملة تدعم الترسّخ في الذاكرة كثيرًا."},{"n":90,"id":"13690415105","app":"duolingo","country":"lv","stars":1,"version":"7.107.2","date":"2026-01-29","title":"Giving hints","body":"Find it annoying when in chess course the guy is always giving a hint verbally and it's not possible to switch it off and for that reason... I'm out","at":"التلميحات","ab":"أجده مزعجًا حين يكون الرجل في دورة الشطرنج يعطي تلميحًا بصوته دائمًا ولا يمكن إيقافه، ولهذا السبب… أنا خارج."},{"n":91,"id":"12929012650","app":"memrise","country":"cz","stars":1,"version":"2025.7.16","date":"2025-07-23","title":"Bug","body":"I’m not able to get in, some bug appear. To get support it’s very hard, like to login NASA main server🥲","at":"عطب","ab":"لا أستطيع الدخول، يظهر عطب ما. والحصول على الدعم صعب جدًّا، كأنّك تسجّل الدخول إلى خادم ناسا الرئيسيّ 🥲"},{"n":92,"id":"13572664512","app":"memrise","country":"pl","stars":5,"version":"2025.12.19","date":"2025-12-30","title":"Peak","body":"The best app for learning languages!","at":"القمّة","ab":"أفضل تطبيق لتعلّم اللغات!"},{"n":93,"id":"9995541540","app":"drops","country":"pl","stars":1,"version":"36.64","date":"2023-06-03","title":"It stopped working","body":"Both general app and German app stopped working. It’s been like this for a month or two. I wanted to purchase premium 😭","at":"توقّف عن العمل","ab":"التطبيق العامّ وتطبيق الألمانية توقّفا معًا عن العمل. الحال هكذا منذ شهر أو شهرين. وكنتُ أريد شراء النسخة المميّزة 😭"},{"n":94,"id":"11929585505","app":"drops","country":"pl","stars":5,"version":"38.47","date":"2024-11-09","title":"Zajebista apka UwU 🥰😊🥳","body":"Spermastyczna aplikacja, pozwala wywalić twój poziom w danym języku w górę, niczym rakieta w kosmos!!!!!! POV: Mój poziom językowy po 5 miesiącach używania Drops: 🚀🚀🚀🚀🔥🔥🔥🐦‍🔥🕯️","at":"تطبيق خرافيّ UwU 🥰😊🥳","ab":"تطبيق مذهل، يرفع مستواك في اللغة إلى الأعلى كصاروخ إلى الفضاء!!!!!! مستواي اللغويّ بعد خمسة أشهر من استعمال Drops: 🚀🚀🚀🔥🔥🔥"},{"n":95,"id":"12031269447","app":"memrise","country":"fi","stars":2,"version":"2024.11.13","date":"2024-12-06","title":"App freezes when reviewing","body":"More often than not, the app freezes after I’ve done a round of reviewing words, and then the same words are reviewed again. This is really frustrating and makes me dread using the app at all. My phone and app are up to date, and this has been going on for months.","at":"التطبيق يتجمّد أثناء المراجعة","ab":"في أغلب الأحيان يتجمّد التطبيق بعد أن أنهي جولة مراجعة كلمات، ثمّ تُراجَع الكلمات نفسها من جديد. هذا محبط حقًّا ويجعلني أكره استعمال التطبيق أصلًا. هاتفي والتطبيق محدَّثان، وهذا مستمرّ منذ شهور."},{"n":96,"id":"11334197949","app":"babbel","country":"nl","stars":3,"version":"21.50.0","date":"2024-06-02","title":"Handig","body":"Leerzaam en werkt beter dan DuoLingo want je leert dingen waar je echt iets aan hebt. Jammer dat vanuit Nederlands naar Spaans niet mogelijk is.","at":"عمليّ","ab":"مفيد ويعمل أفضل من Duolingo لأنّك تتعلّم أشياء تنفعك حقًّا. من المؤسف أنّ التعلّم من الهولندية إلى الإسبانية غير متاح."},{"n":97,"id":"12652432656","app":"mondly","country":"gb","stars":1,"version":"10.49.1","date":"2025-05-13","title":"Disappointed","body":"The app gives you a false sense of accomplishment. I’ve pronounced on propuse wrong words and the app just filled in the correct word and telling me I did a good job. I’m glad I’ve cancelled before the free trial ended","at":"خيبة أمل","ab":"التطبيق يعطيك إحساسًا زائفًا بالإنجاز. نطقتُ كلمات خاطئة عمدًا فملأ التطبيق الكلمة الصحيحة وقال لي إنّي أبليتُ حسنًا. أنا سعيد أنّي ألغيتُ قبل انتهاء التجربة المجّانية."},{"n":98,"id":"13748258889","app":"mondly","country":"us","stars":1,"version":"10.65.0","date":"2026-02-14","title":"Inadequate Translations and Fluency Level Appropiation","body":"After clicking advanced, the app is still continuing to try and teach me how to say basic introductions and vocabulary. And Привет does not mean Hello.","at":"ترجمات ناقصة وتحديد خاطئ لمستوى الطلاقة","ab":"بعد أن ضغطتُ «متقدّم»، ما زال التطبيق يحاول تعليمي كيف أقول التعارف الأساسيّ والمفردات البدائية. ثمّ إنّ Привет لا تعني «مرحبًا»."},{"n":99,"id":"12167309413","app":"memrise","country":"gb","stars":4,"version":"2024.12.11","date":"2025-01-10","title":"Huge bug","body":"The app has been unusable ever since the update that moved the courses. It no longer allows me to press the continue button to actually access the app so I haven’t been able to use it since.","at":"عطب ضخم","ab":"التطبيق غير قابل للاستعمال منذ التحديث الذي نقل الدورات. لم يعد يسمح لي بضغط زرّ المتابعة للدخول إلى التطبيق فعلًا، فلم أستطع استعماله منذ ذلك الحين."},{"n":100,"id":"11295914251","app":"memrise","country":"de","stars":1,"version":"2024.5.14","date":"2024-05-22","title":"Not worth it if you want to be an intermediate language learner","body":"I used Memrise every day for more than 5 years and I loved it. 2 years ago I bought the premium version. In April 2024 they removed the courses that were created by other users from the app. The community courses were super helpful for those wanting to learn more than just the basics for a holiday shopping trip. I will cancel my subscription before the next renewal and can only warn you against choosing Memrise. Think about using Anki","at":"لا يستحقّ إن أردتَ أن تكون متعلّمًا متوسّطًا","ab":"استعملتُ Memrise يوميًّا أكثر من خمس سنوات وأحببتُه. وقبل سنتين اشتريتُ النسخة المميّزة. وفي أبريل 2024 أزالوا من التطبيق الدورات التي أنشأها مستخدمون آخرون. كانت دورات المجتمع مفيدة جدًّا لمن يريد تعلّم أكثر من أساسيّات رحلة تسوّق سياحية. سألغي اشتراكي قبل التجديد القادم و…"},{"n":101,"id":"12895115367","app":"mondly","country":"pl","stars":1,"version":"10.54.0","date":"2025-07-15","title":"Зняло гроші коли пропонувало 7 днів безкоштовно","body":"Проходив уроки, з’явилось повідомлення «щасливий вівторок отримай 7 днів безкоштовно» підтвердив підписку, одразу зняло гроші, формуйте краще свої маркетингові матеріали","at":"سحب المال بينما كان يعرض سبعة أيّام مجّانًا","ab":"كنتُ أؤدّي الدروس فظهرت رسالة «ثلاثاء سعيد، احصل على سبعة أيّام مجّانًا»، فأكّدتُ الاشتراك، فسُحب المال فورًا. صيغوا موادّكم التسويقية بشكل أفضل."},{"n":102,"id":"10223269707","app":"mondly","country":"gb","stars":1,"version":"10.6.0","date":"2023-08-05","title":"Portuguese language","body":"In the Portuguese language option you have the Brazilian flag instead of the Portuguese flag. If you’re are translating to or from Portuguese from Brazil you should write Brazilian Portuguese next to the country flag like you did with the American English language.","at":"اللغة البرتغالية","ab":"في خيار اللغة البرتغالية وضعتم علم البرازيل بدل علم البرتغال. إن كنتم تترجمون من البرتغالية البرازيلية أو إليها فينبغي أن تكتبوا «برتغالية برازيلية» بجانب علم البلد كما فعلتم مع الإنجليزية الأمريكية."},{"n":103,"id":"10851075357","app":"mondly","country":"tr","stars":5,"version":"10.15.0","date":"2024-01-22","title":"Güzel","body":"Yaklaşık on beş uygulama indirdim en iyi be güzeli bu","at":"جميل","ab":"حمّلتُ نحو خمسة عشر تطبيقًا، وهذا أفضلها وأجملها"},{"n":104,"id":"12033166097","app":"pimsleur","country":"dk","stars":1,"version":"5.13","date":"2024-12-06","title":"Svært hvis ikke umuligt at slette sin konto","body":"Det er unødvendigt svært at slette sin konto og det burde ikke være sådan","at":"حذف الحساب صعب إن لم يكن مستحيلًا","ab":"حذف الحساب صعب بلا داعٍ، ولا ينبغي أن يكون كذلك."},{"n":105,"id":"10623064827","app":"pimsleur","country":"fi","stars":1,"version":"5.1.2","date":"2023-11-25","title":"Payment","body":"I wanted to stop using this app but they continue charging my credit card. They don’t help my just tell to contact apple.","at":"الدفع","ab":"أردتُ التوقّف عن استعمال هذا التطبيق لكنّهم يواصلون السحب من بطاقتي الائتمانية. لا يساعدونني، بل يقولون لي اتّصل بآبل فقط."},{"n":106,"id":"12062030069","app":"rosetta","country":"de","stars":2,"version":"8.38.0","date":"2024-12-14","title":"Naja, nicht für Smartphones","body":"Man merkt die Herkunft. 90er auf dem PC und Büchern. Es ist ein Ratekurs von Bildern. Auf einem Smartphone sind die Bilder manchmal nur 1x1cm groß. Da ist der Lerneffekt nicht sehr hoch, man sieht ja nicht, auf was man klickt. Grammatik habe ich bisher nicht entdeckt, vielleicht soll das Nachsprechen von Sätzen dies erledigen. Manchmal soll man was sprechen - es ist jedoch nicht klar was. Die Sprecherkennung funktioniert - jedoch nur, wenn man mit den Antworten immer 1-2 Sekunden wartet.","at":"حسنًا، ليس للهواتف الذكية","ab":"يظهر أصله. تسعينيّات على الحاسوب والكتب. إنّه دورة تخمين من الصور. وعلى الهاتف تكون الصور أحيانًا بحجم سنتيمتر في سنتيمتر، فأثر التعلّم ضعيف جدًّا لأنّك لا ترى على ماذا تضغط. ولم أكتشف قواعد حتّى الآن، وربّما يُفترض أن تؤدّي إعادة نطق الجمل هذا الدور. وأحيانًا يُطلب منك أن تنطق…"},{"n":107,"id":"13443658867","app":"busuu","country":"pl","stars":2,"version":"29.26.1","date":"2025-11-26","title":"busuu please fix your app","body":"a year ago i used this app alot, but now? you have to watch an ad everytime you want to start a lesson or just buy busuu premium. this used to be a great app but now its just based of ads and spending money.","at":"بوسو أصلحوا تطبيقكم أرجوكم","ab":"قبل سنة كنتُ أستعمل هذا التطبيق كثيرًا، أمّا الآن؟ عليك مشاهدة إعلان في كلّ مرّة تريد بدء درس، أو أن تشتري Busuu Premium. كان تطبيقًا رائعًا والآن صار قائمًا على الإعلانات وإنفاق المال."},{"n":108,"id":"11897433222","app":"drops","country":"nl","stars":5,"version":"38.47","date":"2024-10-31","title":"💋","body":"Мне очень нравится","at":"💋","ab":"يعجبني كثيرًا"},{"n":109,"id":"13917909409","app":"busuu","country":"tr","stars":1,"version":"30.7.0","date":"2026-04-03","title":"Premium aldım iptal etmeye çalışıyorum olmuyor","body":"Premium aldım hesabımdan para çekildi ve telefonumdan ödeme yöntemi sildiğimde busu ödemesi istiyor Hesabımdan para çekilmişti hala neyin ödemesi anlamadım Aboneliğimi de iptal etmiş olmama rağmen uygulamada iptal gözükmüyor Ben yıllık diye 1.009 tl abonelik satın aldım ama aylık mı 1.009 tl anlamadım çekilen ücretlerimin de geri ödemesini yalep ediyorum bu kadar saçma bir uygulama olamaz Uygulamayı sildiğimde de üyeliği iptal et diyor yardımcı olun lütfen","at":"اشتريتُ المميّز وأحاول الإلغاء ولا أستطيع","ab":"اشتريتُ النسخة المميّزة وسُحب المال من حسابي، وحين حذفتُ وسيلة الدفع من هاتفي صار يطلب دفعة Busuu. كان المال قد سُحب من حسابي فلم أفهم دفعة ماذا هذه. ومع أنّي ألغيتُ اشتراكي فإنّ الإلغاء لا يظهر في التطبيق. اشتريتُ اشتراكًا بـ1,009 ليرة على أنّه سنويّ لكنّي لم أفهم أهو شهريّ بـ1,009؟ وأطالب باسترداد المبالغ المسحوبة…"},{"n":110,"id":"13212512044","app":"babbel","country":"pl","stars":2,"version":"21.84.0","date":"2025-10-02","title":"Learning with this app is nonsense","body":"Ok, the app works. But the proposed learning model is dry like Sahara. You read something, writing is minimal, speaking is minimal, only dry clicking. Not worth the money.","at":"التعلّم بهذا التطبيق بلا معنى","ab":"حسنًا، التطبيق يعمل. لكنّ نموذج التعلّم المقترح جافّ كالصحراء. تقرأ شيئًا، والكتابة قليلة جدًّا، والكلام قليل جدًّا، مجرّد نقر جافّ. لا يستحقّ المال."},{"n":111,"id":"12395253635","app":"mondly","country":"de","stars":3,"version":"10.44.0","date":"2025-03-07","title":"Okay as an overview","body":"I am learning Farsi. Unfortunately, there are no lessons on the alphabet and no explanations of grammatical structures. Therefore, only a very superficial introduction to the language is possible.","at":"مقبول كنظرة عامّة","ab":"أتعلّم الفارسية. للأسف لا توجد دروس عن الأبجدية ولا شروح للتراكيب النحوية. ولذلك لا تمكن إلّا مقدّمة سطحية جدًّا للغة."},{"n":112,"id":"14011550554","app":"duolingo","country":"dk","stars":1,"version":"7.120.1","date":"2026-04-29","title":"Kvaliteten er skuffende og bliver ikke bedre.","body":"Har brugt duolingo i et halvt år nu. Hver dag. Dets mangler begynder at være tydelig for mig. AI-taleøvelserne er desværre af halvdårlig kvalitet og bliver ikke bedre. Franske ord udtales med engelsk accent af din ‘lærer’, eksempelvis. Har opsagt mit abonnement nu (det giver kun mening at lære med en betalt version - man får kun samtaleøvelser med den dyreste pris). Begynder at lede efter et alternativ.","at":"الجودة مخيّبة ولا تتحسّن","ab":"استعملتُ Duolingo نصف سنة الآن. كلّ يوم. وبدأت نواقصه تتّضح لي. تمارين الكلام بالذكاء الاصطناعيّ للأسف نصف جيّدة ولا تتحسّن. الكلمات الفرنسية تُنطق بلكنة إنجليزية من «معلّمك» مثلًا. ألغيتُ اشتراكي الآن (لا معنى للتعلّم إلّا بنسخة مدفوعة — ولا تحصل على تمارين المحادثة إلّا مع الأغلى…)"},{"n":113,"id":"10223838668","app":"drops","country":"tr","stars":5,"version":"36.69","date":"2023-08-05","title":"классно","body":"пока прошла всего один день, но очень классная подача для того, чтобы выучить слова","at":"رائع","ab":"لم يمرّ سوى يوم واحد حتّى الآن، لكنّ طريقة العرض رائعة جدًّا لحفظ الكلمات"},{"n":114,"id":"11498921765","app":"rosetta","country":"pl","stars":4,"version":"8.34.0","date":"2024-07-16","title":"Jak na razie podoba mi się","body":"Ale…. zawiesza mi się plansza bez możliwości udzielenia odpowiedzi. Naciskam i „odpowiedzi” są nieaktywne. Nie reagują na dotyk. Nie mogę dokończyć ćwiczenia. Mam screeny z tego konkretnego ćwiczenia i mogę udostępnić twórcą, jeśli będą zainteresowani usunięciem błędu.","at":"حتّى الآن يعجبني","ab":"لكن… تتجمّد عندي الشاشة دون إمكانية الإجابة. أضغط فتكون «الإجابات» غير نشطة. لا تستجيب للمس. ولا أستطيع إنهاء التمرين. عندي لقطات شاشة من هذا التمرين بعينه ويمكنني مشاركتها مع المطوّرين إن كانوا مهتمّين بإزالة الخطأ."},{"n":115,"id":"14365895532","app":"babbel","country":"nl","stars":5,"version":"22.7.0","date":"2026-07-30","title":"Great lingo app","body":"Not only for Russian but also French the exercises are cleverly designed and written so you get to learn new linguistic concepts in different ways and context. The voice recognition for speaking exercises is excellent - beats Rosetta Stone (which is archaic and glitchy) and the dialogues are very clear.","at":"تطبيق لغات رائع","ab":"ليس للروسية فقط بل للفرنسية أيضًا — التمارين مصمّمة ومكتوبة بذكاء بحيث تتعلّم مفاهيم لغوية جديدة بطرق وسياقات مختلفة. والتعرّف على الصوت في تمارين الكلام ممتاز — يتفوّق على Rosetta Stone (العتيق والمليء بالأعطال)، والحوارات واضحة جدًّا."},{"n":116,"id":"11054209306","app":"babbel","country":"pl","stars":3,"version":"21.45.0","date":"2024-03-17","title":"Opis kursu niemieckiego","body":"Jest ok. Aczkolwiek głos męski jest zbyt oficjalny i poważny.Generalnie bardzo sztywna ta narracja. Największy minus za zbyt małą czcionkę w odpowiedziach.","at":"وصف دورة الألمانية","ab":"لا بأس. غير أنّ الصوت الرجاليّ رسميّ وجادّ أكثر من اللازم. والسرد عمومًا متيبّس جدًّا. وأكبر عيب هو صغر الخطّ في الإجابات."},{"n":117,"id":"12773414651","app":"drops","country":"de","stars":3,"version":"38.70","date":"2025-06-14","title":"Tolle EU-Sprachenlernen-App! 👌🏼🤩🥳","body":"Konnichi wa! 🙋🏻‍♂️🇯🇵 Ich kann wirklich nur jedem diese App empfehlen. Ich lerne zwar erst seit 7 Tagen (Streak von 7🔥! 🥳) Japanisch 🇯🇵und es hat mich direkt abgeholt (ich nutze auch bereits Premium 😂👌🏼). Da ich auch in der Schule Spanisch 🇪🇸 lerne, mache ich das auch manchmal parallel - denn das geht auch mit Drops. Was mir auch sehr gut gefällt, ist, dass man nach Kategorien lernen kann, die sehr hilfreich und wirklich vielfältig sind. Man wird auch sehr schnell mit den Hieroglyphen warm, ich kann sie jetzt sogar schon teils erkennen - nach 7d wohl bemerkt. Aber mich stören auch ein paar Dinge, weshalb ich ehrlich gesagt keine 5 Sterne geben möchte, sorry: -Grammatik fehlt: das Vokabellernen macht wirklich Spaß und man erzielt auch große Erfolge, aber (bisher) habe ich noch nie die Grammatik gelernt. Das ist meiner Meinung nach sehr wichtig, da man erst eine Struktu
