<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kas Kalba app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#FBF3DE"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD11A"/>
      <stop offset="1" stop-color="#FDC500"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12B15C"/>
      <stop offset="1" stop-color="#029247"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0454C"/>
      <stop offset="1" stop-color="#DA1E28"/>
    </linearGradient>
    <clipPath id="bubbleClip">
      <path d="M158 100
               H354 a68 68 0 0 1 68 68
               V310 a68 68 0 0 1 -68 68
               H236 l-58 58 4 -58 h-24
               a68 68 0 0 1 -68 -68
               V168 a68 68 0 0 1 68 -68 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2A1B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- Speech bubble with Lithuanian flag stripes -->
  <g filter="url(#soft)">
    <g clip-path="url(#bubbleClip)">
      <rect x="80"  y="88"  width="360" height="128" fill="url(#yel)"/>
      <rect x="80"  y="216" width="360" height="112" fill="url(#grn)"/>
      <rect x="80"  y="328" width="360" height="140" fill="url(#red)"/>
    </g>
    <!-- bubble outline -->
    <path d="M158 100
             H354 a68 68 0 0 1 68 68
             V310 a68 68 0 0 1 -68 68
             H236 l-58 58 4 -58 h-24
             a68 68 0 0 1 -68 -68
             V168 a68 68 0 0 1 68 -68 Z"
          fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.9"/>
  </g>

  <!-- Friendly face -->
  <!-- eyes -->
  <g>
    <circle cx="214" cy="212" r="30" fill="#FFFFFF"/>
    <circle cx="316" cy="212" r="30" fill="#FFFFFF"/>
    <circle cx="222" cy="216" r="13" fill="#173A2B"/>
    <circle cx="324" cy="216" r="13" fill="#173A2B"/>
    <circle cx="226" cy="210" r="4.5" fill="#FFFFFF"/>
    <circle cx="328" cy="210" r="4.5" fill="#FFFFFF"/>
  </g>
  <!-- smile -->
  <path d="M198 300 Q256 356 314 300" fill="none" stroke="#FFFFFF"
        stroke-width="20" stroke-linecap="round"/>

  <!-- sparkle -->
  <path d="M372 150 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
